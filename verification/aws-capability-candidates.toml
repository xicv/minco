[[lesson]]
id = "cargo-lambda"
project = "Cargo Lambda"
adopt = "Cargo-native deterministic target artifacts and bounded local emulation patterns."
reject = "Delegating Minco deployment authority or treating Cargo Lambda support as Minco support."
zero_idle_effect = "Compatible when the selected Lambda topology retains zero provisioned concurrency."
ai_first_effect = "Machine-readable commands and deterministic artifacts improve inspectability."
evidence_needed = "Exact artifact, provider rendering, security, promotion and recovery parity."
upstream_sources = ["https://github.com/cargo-lambda/cargo-lambda"]

[[lesson]]
id = "rust-test-tools"
project = "cargo-nextest, cargo-semver-checks, cargo-llvm-cov and cargo-mutants"
adopt = "Selective profiles, explicit release baselines, reproducible coverage and bounded mutation tests."
reject = "Unmeasured repository-wide thresholds or replacing authoritative tests without parity evidence."
zero_idle_effect = "Build-time tooling creates no deployed idle resource."
ai_first_effect = "Structured reports sharpen automated review when findings remain explainable."
evidence_needed = "Measured CI duration, determinism, false-positive rate and maintenance cost."
upstream_sources = ["https://github.com/nextest-rs/nextest", "https://github.com/obi1kenobi/cargo-semver-checks", "https://github.com/taiki-e/cargo-llvm-cov", "https://github.com/sourcefrog/cargo-mutants"]

[[lesson]]
id = "application-frameworks"
project = "Loco, SST, Encore, Wing and Nitric"
adopt = "Convention-driven productivity, visible resource graphs, preflight/runtime separation and explicit infrastructure intent."
reject = "Hidden Redis, workers or schedulers; required managed control planes; generic portability layers that erase AWS security, cost and recovery semantics."
zero_idle_effect = "Only explicit, request-driven resources fit the minimal profile."
ai_first_effect = "Inspectability and stable intent improve agent reasoning; hidden state weakens it."
evidence_needed = "Two concrete Minco implementations before any new extension point, plus cost, security, recovery and provider proof."
upstream_sources = ["https://github.com/loco-rs/loco", "https://github.com/sst/sst", "https://github.com/encoredev/encore", "https://github.com/winglang/wing", "https://github.com/nitrictech/nitric"]
