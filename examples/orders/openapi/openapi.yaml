openapi: 3.1.0
info:
  title: Minco Orders Reference API
  version: 0.1.0
  description: >-
    Contract-first reference application demonstrating Minco's domain,
    application, adapter, HTTP, local development, release, and AWS deployment path.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: system
    description: Process health and dependency readiness.
  - name: orders
    description: Idempotent order placement and retrieval.
paths:
  /health/live:
    get:
      operationId: getLive
      summary: Check whether the API process is alive
      tags: [system]
      security: []
      x-minco-auth: public
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
        default:
          $ref: '#/components/responses/Problem'
  /health/ready:
    get:
      operationId: getReady
      summary: Check whether required dependencies are ready
      tags: [system]
      security: []
      x-minco-auth: public
      responses:
        '200':
          description: All required dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: At least one required dependency is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/Problem'
  /orders:
    post:
      operationId: placeOrder
      summary: Place an order exactly once
      tags: [orders]
      x-minco-idempotent: true
      x-minco-resource:
        name: order
        action: create
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Stable key for safe command retries.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: A new order was accepted
          headers:
            ETag:
              description: Strong entity tag for conditional writes.
              schema: { type: string }
            Location:
              description: Canonical URL of the new order.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDocument'
        '200':
          description: The immutable original order result was replayed
          headers:
            ETag:
              description: Strong entity tag for conditional writes.
              schema: { type: string }
            Location:
              description: Canonical URL of the existing order.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDocument'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listOrders
      summary: List orders with bounded cursor pagination
      tags: [orders]
      x-minco-resource:
        name: order
        action: list
        defaultLimit: 20
        maxLimit: 100
        defaultSort: [-createdAt, -id]
        sortFields: [createdAt, id]
        filterFields: [status]
        cursorFields: [createdAt, id]
      parameters:
        - in: query
          name: page[limit]
          description: Maximum number of orders to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: page[after]
          description: Opaque cursor returned by the previous page.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - in: query
          name: sort
          description: Comma-separated allowlisted fields; prefix descending fields with `-`.
          schema: { type: string }
        - in: query
          name: filter[status]
          description: Exact order status.
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: One bounded page of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCollection'
        default:
          $ref: '#/components/responses/Problem'
  /orders/{orderId}:
    parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOrder
      summary: Retrieve one order
      tags: [orders]
      x-minco-resource:
        name: order
        action: read
      responses:
        '200':
          description: Order detail
          headers:
            ETag:
              description: Strong entity tag for conditional writes.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDocument'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateOrder
      summary: Update an order if its entity tag is current
      tags: [orders]
      x-minco-resource:
        name: order
        action: update
      parameters:
        - in: header
          name: If-Match
          required: true
          description: Strong entity tag from the current representation.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Updated order
          headers:
            ETag:
              description: Strong entity tag for the updated representation.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDocument'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteOrder
      summary: Delete an order if its entity tag is current
      tags: [orders]
      x-minco-resource:
        name: order
        action: delete
      parameters:
        - in: header
          name: If-Match
          required: true
          description: Strong entity tag from the current representation.
          schema: { type: string }
      responses:
        '204':
          description: Order deleted
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /orders/{orderId}/audit:
    parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listOrderAuditHistory
      summary: List the durable semantic action history for an order
      tags: [orders]
      x-minco-resource:
        name: order-audit-history
        action: list
        defaultLimit: 50
        maxLimit: 100
        defaultSort: [-occurredAt, -eventId]
        sortFields: [occurredAt, eventId]
        filterFields: []
        cursorFields: [occurredAt, eventId]
      parameters:
        - in: query
          name: page[limit]
          description: Maximum number of audit actions to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: page[after]
          description: Opaque cursor returned by the previous audit page.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - in: query
          name: sort
          description: Comma-separated allowlisted fields; the default newest-first order is recommended.
          schema: { type: string }
      responses:
        '200':
          description: One bounded page of durable order actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAuditCollection'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: RFC 9457 problem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    DependencyHealth:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready:
          type: boolean
        detail:
          type: [string, 'null']
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [live, service]
      properties:
        live:
          type: boolean
        service:
          type: string
    OrderLineResponse:
      type: object
      additionalProperties: false
      required: [quantity, sku]
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
        sku:
          type: string
    CursorPageInfo:
      type: object
      additionalProperties: false
      required: [hasMore, nextCursor]
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type: [string, 'null']
    OrderCollection:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderResponse'
        page:
          $ref: '#/components/schemas/CursorPageInfo'
    OrderAuditActor:
      type: object
      additionalProperties: false
      required: [kind, subject]
      properties:
        kind:
          type: string
          enum: [human, service, system, migration, database_principal, unknown]
        subject:
          type: [string, 'null']
    OrderAuditChange:
      type: object
      additionalProperties: false
      required: [after, before, field]
      properties:
        after:
          type: [string, 'null']
          description: Privacy-safe literal, digest marker, redaction marker or omission marker.
        before:
          type: [string, 'null']
          description: Privacy-safe literal, digest marker, redaction marker or omission marker.
        field:
          type: string
    OrderAuditCollection:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderAuditEvent'
        page:
          $ref: '#/components/schemas/CursorPageInfo'
    OrderAuditEvent:
      type: object
      additionalProperties: false
      required: [action, actor, changes, correlationId, eventId, occurredAt, operationId, recordedAt, resourceRevision]
      properties:
        action:
          type: string
        actor:
          $ref: '#/components/schemas/OrderAuditActor'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/OrderAuditChange'
        correlationId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        operationId:
          type: string
        recordedAt:
          type: string
          format: date-time
        resourceRevision:
          type: [integer, 'null']
          format: int64
          minimum: 1
    OrderDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/OrderResponse'
    OrderResponse:
      type: object
      additionalProperties: false
      required: [createdAt, customerReference, id, lines, revision, status, updatedAt]
      properties:
        createdAt:
          type: string
          format: date-time
        customerReference:
          type: string
        id:
          type: string
          format: uuid
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineResponse'
        revision:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: '#/components/schemas/OrderStatus'
        updatedAt:
          type: string
          format: date-time
    OrderStatus:
      type: string
      enum: [accepted]
    PlaceOrderLineRequest:
      type: object
      additionalProperties: false
      required: [quantity, sku]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
        sku:
          type: string
          minLength: 1
          maxLength: 80
    PlaceOrderRequest:
      type: object
      additionalProperties: false
      required: [customerReference, lines]
      properties:
        customerReference:
          type: string
          minLength: 1
          maxLength: 64
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PlaceOrderLineRequest'
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [code, detail, requestId, status, title, type]
      properties:
        code:
          type: string
        detail:
          type: string
        errors:
          type: [object, 'null']
          additionalProperties:
            type: array
            items:
              type: string
          x-minco-open-object:
            rationale: Validation field names are application-defined and each value is a list of public-safe messages.
        requestId:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [dependencies, ready]
      properties:
        dependencies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DependencyHealth'
          x-minco-open-object:
            rationale: Dependency check IDs are supplied by the selected plugin graph.
        ready:
          type: boolean
    UpdateOrderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        customerReference:
          type: string
          minLength: 1
          maxLength: 64
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PlaceOrderLineRequest'
