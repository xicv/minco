schema = 1
id = "orders-postgres-seeds"
owner = "application:orders"
backend = "postgres"

[[seed]]
id = "orders-postgres-demo"
version = 1
class = "demo"
source = "demo.sql"
verify = "demo.verify.sql"
depends_on = []
environments = ["local", "development"]
idempotency = "upsert"
mutable_state = "owned_rows"
risk = "replaces_owned_rows"
transaction = "required"
preservation = "preserve_unowned_rows"

[[seed]]
id = "orders-postgres-test"
version = 1
class = "test"
source = "test.sql"
verify = "test.verify.sql"
depends_on = []
environments = ["test"]
idempotency = "upsert"
mutable_state = "owned_rows"
risk = "replaces_owned_rows"
transaction = "required"
preservation = "preserve_unowned_rows"
