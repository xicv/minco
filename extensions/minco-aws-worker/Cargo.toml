[package]
name = "minco-aws-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Explicit AWS Lambda SQS partial-batch worker runtime for Minco"
documentation = "https://docs.rs/minco-aws-worker"
readme = "README.md"
keywords = ["minco", "aws", "lambda", "sqs", "worker"]
categories = ["web-programming", "asynchronous"]
publish = ["crates-io"]
include = [
  "src/**",
  "examples/**",
  "tests/**",
  "Cargo.toml",
  "minco-plugin.json",
  "README.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[package.metadata.minco]
plugin = "minco-plugin.json"

[features]
default = []
events = ["dep:chrono", "dep:minco-plugin-events"]
jobs = ["dep:chrono", "dep:minco-plugin-jobs", "dep:serde", "dep:serde_json", "dep:uuid"]
ticketing-wake = [
  "jobs",
  "dep:minco-plugin-ticketing",
  "dep:sha2",
  "dep:hex",
]

[dependencies]
async-trait.workspace = true
aws_lambda_events.workspace = true
chrono = { workspace = true, optional = true }
futures.workspace = true
lambda_runtime.workspace = true
minco-plugin-events = { workspace = true, optional = true }
minco-plugin-jobs = { workspace = true, optional = true }
minco-plugin-ticketing = { workspace = true, optional = true, features = ["jobs"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-sqs.workspace = true
chrono.workspace = true
minco-aws-adapters = { workspace = true, features = ["s3"] }
minco-plugin-identity.workspace = true
minco-plugin-object-storage.workspace = true
minco-plugin-ticketing = { workspace = true, features = ["sqlite", "jobs"] }
minco-sqlx-sqlite.workspace = true
serde_json.workspace = true
sqlx.workspace = true
uuid.workspace = true

[[example]]
name = "ticketing_mail_seam"
required-features = ["ticketing-wake"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
