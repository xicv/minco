[package]
name = "minco-aws-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Production AWS and signed-webhook adapters for Minco official plugin ports"
documentation = "https://docs.rs/minco-aws-adapters"
readme = "README.md"
keywords = ["minco", "aws", "s3", "sqs", "serverless"]
categories = ["web-programming", "development-tools"]
publish = ["crates-io"]
include = [
  "src/**",
  "tests/**",
  "examples/**",
  "Cargo.toml",
  "minco-plugin.json",
  "README.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[package.metadata.minco]
plugin = "minco-plugin.json"

[features]
default = []
appsync-events = [
  "dep:aws-credential-types",
  "dep:aws-sigv4",
  "dep:http",
  "dep:minco-plugin-realtime",
  "dep:reqwest",
  "dep:url",
]
s3 = [
  "dep:aws-credential-types",
  "dep:aws-sdk-s3",
  "dep:base64",
  "dep:http",
  "dep:minco-plugin-object-storage",
]
sqs = ["dep:aws-sdk-sqs", "dep:http", "dep:minco-plugin-events"]
ses = [
  "dep:aws-config",
  "dep:aws-sdk-sesv2",
  "dep:base64",
  "dep:minco-plugin-notifications",
]
cognito = [
  "dep:aws-sdk-cognitoidentityprovider",
  "dep:minco-plugin-identity",
]
webhook = ["dep:minco-plugin-notifications", "dep:reqwest", "dep:tokio"]
static-site = [
  "s3",
  "dep:aws-sdk-cloudfront",
  "dep:minco-plugin-static-site",
  "dep:tokio",
]
full = ["appsync-events", "s3", "sqs", "ses", "cognito", "webhook", "static-site"]

[dependencies]
async-trait.workspace = true
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sigv4 = { workspace = true, optional = true }
aws-sdk-cloudfront = { workspace = true, optional = true }
aws-sdk-cognitoidentityprovider = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-sdk-sesv2 = { workspace = true, optional = true }
aws-sdk-sqs = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono.workspace = true
hmac.workspace = true
http = { workspace = true, optional = true }
minco-core.workspace = true
minco-plugin-events = { workspace = true, optional = true }
minco-plugin-identity = { workspace = true, optional = true }
minco-plugin-notifications = { workspace = true, optional = true }
minco-plugin-object-storage = { workspace = true, optional = true }
minco-plugin-realtime = { workspace = true, optional = true }
minco-plugin-static-site = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
http.workspace = true
minco-plugin-notifications.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tokio.workspace = true

[[example]]
name = "render_smoke_assets"
required-features = ["static-site"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
