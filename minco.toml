handler = "plugins/minco-plugin-feedback/src/http.rs#list_developer_feedback"
application = "plugins/minco-plugin-feedback/src/service.rs#list"
adapters = ["memory", "postgres", "sqlite", "application-provided"]
tests = ["plugins/minco-plugin-feedback/src/http.rs", "plugins/minco-plugin-feedback/tests/persistence.rs"]

[operations.getDeveloperFeedback]
