application = "plugins/minco-plugin-feedback/src/service.rs#get_for_client"
adapters = ["memory", "postgres", "sqlite", "application-provided"]
tests = ["plugins/minco-plugin-feedback/src/http.rs", "plugins/minco-plugin-feedback/tests/persistence.rs"]

[operations.replyToFeedback]
contract = "plugins/minco-plugin-feedback/openapi/feedback.openapi.yaml"
handler = "plugins/minco-plugin-feedback/src/http.rs#client_reply"
application = "plugins/minco-plugin-feedback/src/service.rs#reply_as_client"
adapters = ["memory", "postgres", "sqlite", "application-provided"]
