schema = 1
name = "minco-framework"
contract = "examples/orders/openapi/openapi.yaml"
generated = "examples/orders/api/src/generated.rs"
deployment_config = "examples/orders/config/minco.dev.toml"
roadmap = "roadmap/roadmap.yaml"
tasks = "tasks"
plugin_catalog = "plugins/catalog.toml"
quality = "quality.toml"

[configuration]
root = "examples/orders/config/environments"
default_file = "default.toml"
local_override = ".local.toml"
environment_prefix = "MINCO_CONFIG__"

[[configuration.fields]]
key = "application.name"
kind = "string"
required = true
secret = false
description = "Stable application service name"
default = "minco-framework"

[[configuration.fields]]
key = "runtime.log_level"
kind = "string"
required = true
secret = false
description = "Default structured logging filter"
default = "info"

[[configuration.fields]]
key = "database.url"
kind = "string"
required = true
secret = true
description = "Opaque database connection secret reference"

[[configuration.fields]]
key = "audit.database_url"
kind = "string"
required = false
secret = true
description = "Opaque connection secret reference for the physically separate audit ledger"

[architecture]
domain_roots = ["examples/orders/domain"]
application_roots = ["examples/orders/application"]
api_roots = ["examples/orders/api"]

[plugins]
enabled = ["health", "observability", "idempotency", "audit"]
disabled = []

[database]
default_profile = "neon"

[cost_policy]
deny_fixed_compute = true
deny_nat_gateway = true
deny_provisioned_concurrency = true
deny_scheduled_wakeups = true
max_reserved_concurrency = 5
max_database_connections = 20

[migrations]
roots = [
  "extensions/minco-sqlx-postgres/migrations/plugins",
  "extensions/minco-sqlx-sqlite/migrations/plugins",
  "examples/orders/migrations/postgres",
  "examples/orders/migrations/sqlite",
]

[seeds]
roots = [
  "examples/orders/seeds/postgres",
  "examples/orders/seeds/sqlite",
]

[commands]
package = ["scripts/aws/build-lambda.sh"]
hosted_verify = ["scripts/aws/smoke.sh"]
test_unit = ["cargo test --workspace --lib --all-features"]
test_feature = ["cargo test -p orders-api -p orders-application -p orders-adapters --all-features"]
test_e2e = ["scripts/test/e2e.sh"]
test_all = [
  "cargo test --workspace --all-targets --all-features",
  "scripts/test/e2e.sh",
]

[development]
default_environment = "local"
default_profile = "postgres"
compose_file = "infra/local/compose.yaml"

[development.profiles.postgres]
deployment_config = "examples/orders/config/minco.dev.toml"
migration = { program = "cargo", arguments = ["run", "-p", "orders-service", "--bin", "orders-migrate", "--features", "all-runtimes"] }

[development.profiles.postgres.seeds.demo]
program = "scripts/dev/seed.sh"
arguments = ["demo"]

[development.profiles.sqlite]
deployment_config = "examples/orders/config/minco.local-sqlite.toml"
migration = { program = "cargo", arguments = ["run", "-p", "orders-service", "--bin", "orders-migrate", "--features", "all-runtimes"] }

[development.profiles.sqlite.seeds.demo]
program = "scripts/dev/seed.sh"
arguments = ["demo"]

[development.api]
id = "api"
default_enabled = true
command = { program = "cargo", arguments = ["run", "-p", "orders-service", "--bin", "orders-local", "--features", "all-runtimes"] }
readiness = { kind = "http", url = "http://127.0.0.1:3000/health/ready" }

[operations.healthLive]
handler = "examples/orders/api/src/lib.rs#health_live"
tests = ["examples/orders/api/src/lib.rs#live_is_public"]

[operations.healthReady]
handler = "examples/orders/api/src/lib.rs#health_ready"
tests = ["examples/orders/api/src/lib.rs#ready_reports_dependencies"]

[operations.placeOrder]
handler = "examples/orders/api/src/lib.rs#place_order"
application = "examples/orders/application/src/lib.rs#PlaceOrder"
adapters = ["memory", "postgres", "sqlite", "dynamodb"]
tests = ["examples/orders/application/src/lib.rs#place_order", "examples/orders/api/src/lib.rs#place_order", "examples/orders/adapters/tests/dynamodb.rs#all_orders_ports_preserve_idempotency_sort_cursor_revision_and_soft_delete"]

[operations.getOrder]
handler = "examples/orders/api/src/lib.rs#get_order"
application = "examples/orders/application/src/lib.rs#GetOrder"
adapters = ["memory", "postgres", "sqlite", "dynamodb"]
tests = ["examples/orders/application/src/lib.rs#get_order", "examples/orders/api/src/lib.rs#get_order", "examples/orders/adapters/tests/dynamodb.rs#all_orders_ports_preserve_idempotency_sort_cursor_revision_and_soft_delete"]

[operations.listOrders]
handler = "examples/orders/api/src/lib.rs#list_orders"
application = "examples/orders/application/src/lib.rs#ListOrders"
adapters = ["memory", "postgres", "sqlite", "dynamodb"]
tests = ["examples/orders/api/src/lib.rs#list_orders_uses_opaque_bound_cursors_and_a_stable_page_shape", "examples/orders/adapters/tests/sqlite.rs#cursor_update_and_delete_are_revision_safe", "examples/orders/adapters/tests/dynamodb.rs#all_orders_ports_preserve_idempotency_sort_cursor_revision_and_soft_delete"]

[operations.updateOrder]
handler = "examples/orders/api/src/lib.rs#update_order"
application = "examples/orders/application/src/lib.rs#UpdateOrder"
adapters = ["memory", "postgres", "sqlite", "dynamodb"]
tests = ["examples/orders/application/src/lib.rs#empty_updates_fail_before_the_update_port_is_called", "examples/orders/api/src/lib.rs#resource_crud_is_shaped_and_conditionally_safe_through_the_real_router", "examples/orders/adapters/tests/sqlite.rs#cursor_update_and_delete_are_revision_safe", "examples/orders/adapters/tests/dynamodb.rs#all_orders_ports_preserve_idempotency_sort_cursor_revision_and_soft_delete"]

[operations.deleteOrder]
handler = "examples/orders/api/src/lib.rs#delete_order"
application = "examples/orders/application/src/lib.rs#DeleteOrder"
adapters = ["memory", "postgres", "sqlite", "dynamodb"]
tests = ["examples/orders/api/src/lib.rs#resource_crud_is_shaped_and_conditionally_safe_through_the_real_router", "examples/orders/adapters/tests/sqlite.rs#cursor_update_and_delete_are_revision_safe", "examples/orders/adapters/tests/dynamodb.rs#all_orders_ports_preserve_idempotency_sort_cursor_revision_and_soft_delete"]

[operations.listOrderAuditHistory]
handler = "examples/orders/api/src/lib.rs#list_order_audit_history"
application = "examples/orders/application/src/lib.rs#ListOrderAuditHistory"
adapters = ["memory", "postgres", "sqlite", "dynamodb"]
tests = ["examples/orders/application/src/lib.rs#audit_history_requires_its_own_permission_before_reading", "examples/orders/api/src/lib.rs#resource_crud_is_shaped_and_conditionally_safe_through_the_real_router"]

