[operations.getClientFeedbackAttachment]
contract = "plugins/minco-plugin-feedback/openapi/feedback.openapi.yaml"
handler = "plugins/minco-plugin-feedback/src/http.rs#client_attachment"
application = "plugins/minco-plugin-feedback/src/service.rs#attachment_for_client"
