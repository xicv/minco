AWSTemplateFormatVersion: '2010-09-09'
Description: Bounded Minco AppSync Events proof; delete the stack after the run.

Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  CodeObjectVersion:
    Type: String

Resources:
  ProofUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-subscribers'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      DeletionProtection: INACTIVE
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 20
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 1

  ProofUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      UserPoolId: !Ref ProofUserPool
      ClientName: !Sub '${AWS::StackName}-browser'
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      AccessTokenValidity: 5
      IdTokenValidity: 5
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  RealtimeApi:
    Type: AWS::AppSync::Api
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub '${AWS::StackName}-realtime'
      EventConfig:
        AuthProviders:
          - AuthType: AWS_IAM
          - AuthType: AMAZON_COGNITO_USER_POOLS
            CognitoConfig:
              UserPoolId: !Ref ProofUserPool
              AwsRegion: !Ref AWS::Region
              AppIdClientRegex: !Sub '^${ProofUserPoolClient}$'
        ConnectionAuthModes:
          - AuthType: AMAZON_COGNITO_USER_POOLS
        DefaultPublishAuthModes:
          - AuthType: AWS_IAM
        DefaultSubscribeAuthModes:
          - AuthType: AMAZON_COGNITO_USER_POOLS

  RealtimeNamespace:
    Type: AWS::AppSync::ChannelNamespace
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      ApiId: !GetAtt RealtimeApi.ApiId
      Name: orders
      CodeHandlers: |
        import { util } from '@aws-appsync/utils'
        export function onSubscribe(ctx) {
          const claim = ctx.identity && ctx.identity.sub
          const requested = ctx.info.channel.path
          const allowed = `/orders/${claim}/orders`
          if (typeof claim !== 'string' || requested !== allowed) {
            util.unauthorized()
          }
        }
      PublishAuthModes:
        - AuthType: AWS_IAM
      SubscribeAuthModes:
        - AuthType: AMAZON_COGNITO_USER_POOLS

  PublisherLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-publisher'
      RetentionInDays: 1

  PublisherRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: proof-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${PublisherLogGroup.Arn}:*'
              - Effect: Allow
                Action: appsync:EventPublish
                Resource: !Sub 'arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${RealtimeApi.ApiId}/channelNamespace/orders'

  Publisher:
    Type: AWS::Lambda::Function
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn:
      - PublisherLogGroup
      - RealtimeNamespace
    Properties:
      FunctionName: !Sub '${AWS::StackName}-publisher'
      Architectures: [arm64]
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
        S3ObjectVersion: !Ref CodeObjectVersion
      Environment:
        Variables:
          MINCO_REALTIME_HTTP_ENDPOINT: !Sub 'https://${RealtimeApi.Dns.Http}/event'
          MINCO_REALTIME_NAMESPACE: orders
          RUST_LOG: info
      Handler: bootstrap
      MemorySize: 256
      Role: !GetAtt PublisherRole.Arn
      Runtime: provided.al2023
      Timeout: 15
      TracingConfig:
        Mode: PassThrough

Outputs:
  RealtimeHttpEndpoint:
    Value: !Sub 'https://${RealtimeApi.Dns.Http}/event'
  RealtimeWebSocketEndpoint:
    Value: !Sub 'wss://${RealtimeApi.Dns.Realtime}/event/realtime'
  UserPoolId:
    Value: !Ref ProofUserPool
  UserPoolClientId:
    Value: !Ref ProofUserPoolClient
  PublisherFunctionName:
    Value: !Ref Publisher
