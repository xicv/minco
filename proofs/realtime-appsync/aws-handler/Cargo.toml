[package]
name = "minco-realtime-appsync-live-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace]
resolver = "3"

[dependencies]
async-trait = "=0.1.91"
aws-config = { version = "=1.10.1", default-features = false, features = ["credentials-process", "default-https-client", "rt-tokio"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
lambda_runtime = "=1.3.0"
minco-aws-adapters = { path = "../../../extensions/minco-aws-adapters", features = ["appsync-events"] }
minco-plugin-realtime = { path = "../../../plugins/minco-plugin-realtime" }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.22"

[lints.rust]
unsafe_code = "forbid"
