[package]
name = "minco-realtime-pusher-aws-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace]
resolver = "3"

[dependencies]
aws-config = { version = "=1.10.1", default-features = false, features = ["credentials-process", "default-https-client", "rt-tokio"] }
aws-sdk-apigatewaymanagement = { version = "=1.106.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "=1.120.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-lambda = { version = "=1.138.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
lambda_runtime = "=1.3.0"
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt"] }

[lints.rust]
unsafe_code = "forbid"
