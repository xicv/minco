schema: 1
product: Minco
milestones:
- id: M0
  name: Constitution and repository foundation
  status: complete
  depends_on: []
  outcome: Architectural invariants, task schema, quality gates, and handoff conventions are committed.
  exit_criteria:
  - The contract-first, AI-native, AWS-native constitution is explicit.
  - Repository-native roadmap and task files validate.
  - Architecture dependency rules are executable.
- id: M1
  name: Contract-to-local vertical slice
  status: complete
  depends_on:
  - M0
  outcome: A complete orders feature runs from OpenAPI through domain, application, adapters, Axum, and local composition.
  exit_criteria:
  - OpenAPI operations and generated bindings are bijective.
  - Application and HTTP tests pass on the pinned toolchain.
  - The same router is used by local and Lambda entrypoints.
- id: M2
  name: Modules and application graph
  status: complete
  depends_on:
  - M1
  outcome: Statically linked modules describe capabilities, operations, migrations, health, resources, and costs.
  exit_criteria:
  - Duplicate and missing capabilities fail deterministically.
  - Dependency cycles and route conflicts fail before serving traffic.
  - Graph output is machine-readable.
- id: M3
  name: PostgreSQL and SQLite foundations
  status: complete
  depends_on:
  - M2
  outcome: Explicit SQLx adapters and migrations support PostgreSQL and SQLite without an ORM.
  exit_criteria:
  - Shared behavioral tests pass for supported portable operations.
  - Database-specific behavior remains explicit.
  - Migration, seed, and reset operations are separate.
- id: M4
  name: Local AWS and deployment Plan IR
  status: complete
  depends_on:
  - M2
  outcome: One graph drives local dependency resolution, Rustack endpoint wiring, deployment planning, and cost
    diagnostics.
  exit_criteria:
  - Plan IR and SAM rendering are deterministic.
  - Minimal-idle policy rejects fixed compute, NAT, schedules, and provisioned concurrency.
  - Rustack services are started only when declared.
- id: M5
  name: AWS development deployment
  status: complete
  depends_on:
  - M3
  - M4
  outcome: A native ARM64 Lambda ZIP is deployed behind API Gateway HTTP API and verified in a real AWS dev environment.
  exit_criteria:
  - Build-once release artifact and manifest are produced.
  - Hosted contract, readiness, authentication, and performance smoke checks pass.
  - Deployment evidence contains no secrets.
- id: M6
  name: Essential official extensions
  status: active
  depends_on:
  - M5
  outcome: Optional sessions, identity, object storage, queue/outbox, notifications, audit, Feedback, and static-site extensions use the same capability model.
  exit_criteria:
  - Every extension is independently selectable and testable.
  - No extension introduces hidden scheduled work or fixed capacity.
  - IAM permissions derive from declared capabilities.
  - Typed registrations retain bounded, non-spoofable owner provenance for inspection.
- id: M7
  name: Two-application stabilization
  status: active
  depends_on:
  - M9
  - M10
  outcome: Evidence from bounded GarmentIQ and CGSP Minco slices informs the compatibility freeze without adding
    product concepts to the framework.
  exit_criteria:
  - At least one separately authorized real slice from each application uses Minco.
  - Framework APIs encode no product-specific business concepts.
  - Adoption gaps are fixed in bounded Minco tasks or retained as explicit application policy.
- id: M8
  name: Cargo publication and ecosystem bootstrap
  status: complete
  depends_on:
  - M0
  outcome: A versioned Minco crate family, facade crate, Cargo subcommand, and application generator pass crates.io
    packaging gates and receive a controlled first release.
  exit_criteria:
  - Every public package has complete crates.io metadata, license files, versioned internal dependencies, and a
    reviewed include list.
  - The facade feature matrix, workspace tests, documentation, and cargo publish dry-run pass on Rust 1.97.1.
  - The first release is uploaded in dependency order and trusted publishing is configured only after ownership
    exists.
  - Later pre-1.0 minor candidates preserve the lock-step package family, publish from exact qualified tags, and
    keep source, hosted, registry, documentation and deployment evidence separate.
- id: M9
  name: Application lifecycle and developer experience
  status: complete
  depends_on:
  - M4
  outcome: One graph-driven control plane covers typed configuration, database lifecycle, safe seeders, local
    development, resource API conventions, vertical-slice generation, and compatibility reporting.
  exit_criteria:
  - Generated PostgreSQL and SQLite applications complete the documented local golden path.
  - Configuration, migration, seed, and process plans are strict, redacted, deterministic, and inspectable.
  - Generators produce reviewed structure and failing tests without fake business behavior.
  - Resource APIs use one validated contract for success envelopes, cursor pagination, conditional writes, and
    stable Problem responses without introducing a generic CRUD repository.
  - Complete quality remains authoritative locally while optional hosted CI defaults to bounded clean-runner
    evidence and reserves the full matrix for explicit release qualification.
- id: M10
  name: Safe deployment controller
  status: active
  depends_on:
  - M5
  - M9
  outcome: Operators preview, apply, verify, promote, and assess rollback of one exact release through guarded
    deployment and database stages.
  exit_criteria:
  - Account, region, environment, change-set, migration, and destructive-action guards fail closed.
  - Deployment and promotion use a verified exact artifact and emit durable receipts.
  - Bounded real-AWS rehearsal proves hosted verification and rollback behavior.
- id: M11
  name: Plugin ecosystem and documentation
  status: active
  depends_on:
  - M9
  - M10
  outcome: A versioned documentation product and public conformance workflow make Minco and its static plugin
    ecosystem discoverable without runtime package discovery.
  exit_criteria:
  - Tutorials, how-to guides, reference, and explanations are versioned, searchable, and checked.
  - Official and third-party-style plugins pass the same public conformance kit.
  - Package, feature, plugin, CLI, and diagnostic references derive from authoritative metadata.
- id: M12
  name: AI workbench and 1.0 preparation
  status: planned
  depends_on:
  - M7
  - M10
  - M11
  outcome: Stable local AI tooling, multi-application adoption evidence, an explicit compatibility freeze, and
    release gates produce a credible Minco 1.0 candidate.
  exit_criteria:
  - Local read-only MCP and workbench surfaces expose bounded redacted graph and evidence models.
  - Public Rust APIs, Cargo features, CLI, configuration, Plan IR, and plugin contracts are audited and frozen.
  - Security, recovery, load, documentation, package, and release gates pass on the exact candidate.
