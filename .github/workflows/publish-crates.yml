name: Publish Minco crates

on:
  workflow_dispatch:
    inputs:
      authenticate:
        description: Verify crates.io OIDC authentication without uploading
        required: true
        default: false
        type: boolean
      publish:
        description: Upload an exact locally qualified release tag to crates.io
        required: true
        default: false
        type: boolean
      release_tag:
        description: Immutable release tag to check out and publish
        required: false
        default: ""
        type: string
      resume_packages:
        description: Optional newline-separated release packages for an audited partial-publication recovery
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-publication
  cancel-in-progress: false

jobs:
  authentication:
    if: ${{ inputs.authenticate && !inputs.publish }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - name: Obtain and revoke a short-lived crates.io token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

  release:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Sync locked Python validation dependencies
        run: uv sync --locked --only-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - name: Verify release tag
