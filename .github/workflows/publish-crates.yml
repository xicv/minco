name: Publish Minco crates

on:
  workflow_dispatch:
    inputs:
      authenticate:
        description: Verify crates.io OIDC authentication without uploading
        required: true
        default: false
        type: boolean
      publish:
        description: Upload to crates.io after every gate succeeds
        required: true
        default: false
        type: boolean
      release_tag:
        description: Immutable release tag to check out and publish
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  authentication:
    if: ${{ inputs.authenticate && !inputs.publish }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - name: Obtain and revoke a short-lived crates.io token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

  release:
    if: ${{ !inputs.authenticate || inputs.publish }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Sync locked Python validation dependencies
        run: uv sync --locked --only-dev
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install pinned JJ for compatibility tests
        run: |
          cargo install --locked --bin jj jj-cli --version 0.43.0
          jj --version
      - name: Install pinned ripgrep for release scripts
        run: |
          cargo install --locked ripgrep --version 15.2.0
          rg --version
      - name: Verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          if [[ -z "$release_tag" ]]; then
            case "$GITHUB_REF" in
              refs/tags/*) release_tag="${GITHUB_REF#refs/tags/}" ;;
              *)
                echo "release_tag is required unless the workflow runs from a tag" >&2
                exit 1
                ;;
            esac
          fi
          version="$(uv run --locked python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version'])
          PY
          )"
          test "$release_tag" = "v${version}"
          tag_commit="$(git rev-parse "refs/tags/${release_tag}^{commit}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
      - name: Static and packaging validation
        run: |
          uv run --locked python scripts/validate_static.py
          uv run --locked python scripts/validate_publish.py --check-registry
          uv run --locked python scripts/deep_review.py
          uv run --locked python scripts/test/feedback_contract.py
          node --check plugins/minco-plugin-feedback/assets/widget.js
      - name: Format
        run: cargo fmt --all -- --check
      - name: Facade feature matrix
        run: |
          cargo check -p minco --no-default-features --locked
          cargo check -p minco --locked
          cargo check -p minco --all-features --locked
          cargo check -p cargo-minco --locked
          cargo test -p minco --no-default-features --locked
          cargo test -p minco --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Generated application smoke matrix
        run: scripts/test/generated_apps.sh
      - name: Documentation
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Publish dry run
        run: scripts/release/publish.sh --skip-quality
      - name: Obtain short-lived crates.io token
        if: ${{ inputs.publish }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish selected crate family
        if: ${{ inputs.publish }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          MINCO_RELEASE_TAG: ${{ inputs.release_tag }}
        run: GITHUB_REF="refs/tags/${MINCO_RELEASE_TAG}" scripts/release/publish.sh --execute --skip-quality
