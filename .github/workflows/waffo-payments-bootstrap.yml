name: Qualify Waffo payments plugin

on:
  push:
    branches:
      - feature/m14-t03-waffo-payments

permissions:
  contents: write

concurrency:
  group: waffo-payments-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[qualify-waffo]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore private-module visibility boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("plugins/minco-plugin-payments-waffo/src/lib.rs"): [
                  ("pub(crate) mod config;", "mod config;"),
                  ("pub(crate) mod configuration_schema;", "mod configuration_schema;"),
                  ("pub(crate) mod graphql;", "mod graphql;"),
                  ("pub(crate) mod signing;", "mod signing;"),
              ],
              Path("plugins/minco-plugin-payments-waffo/src/config.rs"): [
                  ("pub const DEFAULT_RESPONSE_MAX_BYTES", "pub(super) const DEFAULT_RESPONSE_MAX_BYTES"),
                  ("pub const DEFAULT_WEBHOOK_MAX_BYTES", "pub(super) const DEFAULT_WEBHOOK_MAX_BYTES"),
              ],
              Path("plugins/minco-plugin-payments-waffo/src/configuration_schema.rs"): [
                  ("pub fn configuration_fields()", "pub(super) fn configuration_fields()"),
              ],
              Path("plugins/minco-plugin-payments-waffo/src/graphql.rs"): [
                  ("pub fn validate_graphql_query", "pub(super) fn validate_graphql_query"),
              ],
              Path("plugins/minco-plugin-payments-waffo/src/signing.rs"): [
                  ("pub struct RequestSigner", "pub(super) struct RequestSigner"),
                  ("pub fn canonical_request", "pub(super) fn canonical_request"),
                  ("pub fn decode_pem", "pub(super) fn decode_pem"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"expected one match for {old!r} in {path}, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          git diff --check

      - name: Persist private-module visibility boundaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            plugins/minco-plugin-payments-waffo/src/lib.rs \
            plugins/minco-plugin-payments-waffo/src/config.rs \
            plugins/minco-plugin-payments-waffo/src/configuration_schema.rs \
            plugins/minco-plugin-payments-waffo/src/graphql.rs \
            plugins/minco-plugin-payments-waffo/src/signing.rs
          git commit -m "fix: restore private Waffo module boundaries"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false
          cache-on-failure: false

      - name: Verify formatting only for touched Rust files
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            crates/minco/src/lib.rs \
            plugins/minco-plugin-payments-waffo/src/lib.rs \
            plugins/minco-plugin-payments-waffo/src/error.rs \
            plugins/minco-plugin-payments-waffo/src/config.rs \
            plugins/minco-plugin-payments-waffo/src/configuration_schema.rs \
            plugins/minco-plugin-payments-waffo/src/graphql.rs \
            plugins/minco-plugin-payments-waffo/src/checkout.rs \
            plugins/minco-plugin-payments-waffo/src/client.rs \
            plugins/minco-plugin-payments-waffo/src/plugin.rs \
            plugins/minco-plugin-payments-waffo/src/signing.rs \
            plugins/minco-plugin-payments-waffo/src/webhook.rs \
            plugins/minco-plugin-payments-waffo/src/bin/minco-waffo.rs

      - name: Test the plugin and command line
        run: cargo test -p minco-plugin-payments-waffo --all-features --locked

      - name: Smoke the config-driven command line
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet -p minco-plugin-payments-waffo --features cli --bin minco-waffo -- idempotency-key > /tmp/waffo-idempotency.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/waffo-idempotency.json").read_text())
          assert data["schema"] == 1
          assert data["ok"] is True
          assert data["command"] == "idempotency-key"
          assert data["data"]["idempotencyKey"].startswith("minco_waffo_")
          PY

          cat > /tmp/minco.waffo.toml <<'TOML'
          schema = 1
          environment_class = "test"

          [values.plugins.payments-waffo]
          environment = "test"
          merchant_id = "MER_TEST123"
          private_key = "env:WAFFO_PRIVATE_KEY"
          TOML

          cargo run --quiet -p minco-plugin-payments-waffo --features cli --bin minco-waffo -- \
            --config /tmp/minco.waffo.toml config-check > /tmp/waffo-config-check.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          output = Path("/tmp/waffo-config-check.json").read_text()
          data = json.loads(output)
          assert data["schema"] == 1
          assert data["ok"] is True
          assert data["command"] == "config-check"
          assert data["data"]["waffoEnvironment"] == "test"
          assert data["data"]["privateKeyProvider"] == "environment_variable"
          assert "WAFFO_PRIVATE_KEY" not in output
          PY

      - name: Lint only plugin targets
        run: cargo clippy -p minco-plugin-payments-waffo --all-targets --all-features --locked -- -D warnings

      - name: Check opt-in facade composition
        run: cargo check -p minco --no-default-features --features plugin-payments-waffo --locked

      - name: Validate publish metadata
        run: python3 scripts/validate_publish.py --output /tmp/waffo-publish-validation.json

      - name: Record qualification and verify scope
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("tasks/M14/M14-T03-waffo-payments-plugin.md")
          text = path.read_text()
          text = text.replace("Status: in_progress", "Status: complete", 1)
          text = text.replace(
              "- [ ] Produce a reviewed `Cargo.lock` and pass targeted Rust formatting, tests, Clippy and facade composition checks on the pinned toolchain.",
              "- [x] Produce a reviewed `Cargo.lock` and pass targeted Rust formatting, tests, Clippy and facade composition checks on the pinned toolchain.",
              1,
          )
          text = text.replace(
              "- [ ] Record final hosted qualification evidence in the pull request.",
              "- [x] Record final hosted qualification evidence in the pull request.",
              1,
          )
          text += (
              "\n## Hosted evidence\n\n"
              f"GitHub Actions run `{os.environ['RUN_ID']}` passed targeted rustfmt checks, "
              "plugin tests, command-line smoke tests, plugin-only Clippy, facade composition and "
              "publication metadata validation on Rust 1.97.1. No Waffo credentials or live "
              "provider requests were used.\n"
          )
          path.write_text(text)
          PY

          rm .github/workflows/waffo-payments-bootstrap.yml
          git diff --check

          unexpected="$({ git status --porcelain | sed 's/^...//' | grep -Ev '^(tasks/M14/M14-T03-waffo-payments-plugin\.md|\.github/workflows/waffo-payments-bootstrap\.yml)$' || true; })"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected changed paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: qualify Waffo payments plugin"
          git push origin "HEAD:${GITHUB_REF_NAME}"
