name: Qualify Waffo payments plugin

on:
  push:
    branches:
      - feature/m14-t03-waffo-payments

permissions:
  contents: write

concurrency:
  group: waffo-payments-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[qualify-waffo]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply reviewed lint corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}: found {count}")
              path.write_text(text.replace(old, new, 1))

          client = Path("plugins/minco-plugin-payments-waffo/src/client.rs")
          replace_once(client, "        private_key: SecretValue,\n", "        private_key: &SecretValue,\n")
          replace_once(
              client,
              "        #[derive(Deserialize)]\n        struct Response {\n            webhook: WaffoWebhook,\n        }\n        Ok(decode_data::<Response>(data)?.webhook)\n",
              "        Ok(decode_data::<AddWebhookResponse>(data)?.webhook)\n",
          )
          replace_once(
              client,
              "#[derive(Debug, Deserialize)]\nstruct ApiEnvelope {\n",
              "#[derive(Debug, Deserialize)]\nstruct AddWebhookResponse {\n    webhook: WaffoWebhook,\n}\n\n#[derive(Debug, Deserialize)]\nstruct ApiEnvelope {\n",
          )
          replace_once(
              client,
              "        let first = envelope.errors.into_iter().next().unwrap_or(WaffoApiError {\n            message: fallback_status_message(status),\n            layer: None,\n        });\n",
              "        let first = envelope\n            .errors\n            .into_iter()\n            .next()\n            .unwrap_or_else(|| WaffoApiError {\n                message: fallback_status_message(status),\n                layer: None,\n            });\n",
          )

          plugin = Path("plugins/minco-plugin-payments-waffo/src/plugin.rs")
          replace_once(
              plugin,
              "            .field(\"configuration\", &self.configuration)\n            .finish()\n",
              "            .field(\"configuration\", &self.configuration)\n            .finish_non_exhaustive()\n",
          )
          replace_once(
              plugin,
              "        WaffoClient::new(\n            Arc::clone(&self.configuration),\n            private_key,\n            Arc::clone(&self.idempotency),\n        )\n",
              "        WaffoClient::new(\n            Arc::clone(&self.configuration),\n            &private_key,\n            Arc::clone(&self.idempotency),\n        )\n",
          )

          webhook = Path("plugins/minco-plugin-payments-waffo/src/webhook.rs")
          replace_once(
              webhook,
              "        let verified = verifier.verify_at(&header, &body, timestamp).unwrap();\n",
              "        let verified_event = verifier.verify_at(&header, &body, timestamp).unwrap();\n",
          )
          text = webhook.read_text()
          count = text.count("verified.")
          if count != 3:
              raise SystemExit(f"expected three verified-field references, found {count}")
          webhook.write_text(text.replace("verified.", "verified_event."))
          PY

          git diff --check

      - name: Persist reviewed source corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            plugins/minco-plugin-payments-waffo/src/client.rs \
            plugins/minco-plugin-payments-waffo/src/plugin.rs \
            plugins/minco-plugin-payments-waffo/src/webhook.rs
          if ! git diff --cached --quiet; then
            git commit -m "fix: resolve Waffo lint findings"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false
          cache-on-failure: false

      - name: Verify formatting only for touched Rust files
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            crates/minco/src/lib.rs \
            plugins/minco-plugin-payments-waffo/src/lib.rs \
            plugins/minco-plugin-payments-waffo/src/error.rs \
            plugins/minco-plugin-payments-waffo/src/config.rs \
            plugins/minco-plugin-payments-waffo/src/configuration_schema.rs \
            plugins/minco-plugin-payments-waffo/src/graphql.rs \
            plugins/minco-plugin-payments-waffo/src/checkout.rs \
            plugins/minco-plugin-payments-waffo/src/client.rs \
            plugins/minco-plugin-payments-waffo/src/plugin.rs \
            plugins/minco-plugin-payments-waffo/src/signing.rs \
            plugins/minco-plugin-payments-waffo/src/webhook.rs \
            plugins/minco-plugin-payments-waffo/src/bin/minco-waffo.rs

      - name: Test the plugin and command line
        run: cargo test -p minco-plugin-payments-waffo --all-features --locked

      - name: Lint only plugin targets
        run: cargo clippy -p minco-plugin-payments-waffo --all-targets --all-features --locked -- -D warnings

      - name: Check opt-in facade composition
        run: cargo check -p minco --no-default-features --features plugin-payments-waffo --locked

      - name: Validate publish metadata
        run: python3 scripts/validate_publish.py --output /tmp/waffo-publish-validation.json

      - name: Record qualification and verify scope
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("tasks/M14/M14-T03-waffo-payments-plugin.md")
          text = path.read_text()
          text = text.replace("Status: in_progress", "Status: complete", 1)
          text = text.replace(
              "- [ ] Produce a reviewed `Cargo.lock` and pass targeted Rust formatting, tests, Clippy and facade composition checks on the pinned toolchain.",
              "- [x] Produce a reviewed `Cargo.lock` and pass targeted Rust formatting, tests, Clippy and facade composition checks on the pinned toolchain.",
              1,
          )
          text = text.replace(
              "- [ ] Record final hosted qualification evidence in the pull request.",
              "- [x] Record final hosted qualification evidence in the pull request.",
              1,
          )
          text += (
              "\n## Hosted evidence\n\n"
              f"GitHub Actions run `{os.environ['RUN_ID']}` passed targeted rustfmt checks, "
              "plugin tests, plugin-only Clippy, facade composition and publication metadata "
              "validation on Rust 1.97.1. No Waffo credentials or live provider requests were used.\n"
          )
          path.write_text(text)
          PY

          rm .github/workflows/waffo-payments-bootstrap.yml
          git diff --check

          unexpected="$({ git status --porcelain | sed 's/^...//' | grep -Ev '^(tasks/M14/M14-T03-waffo-payments-plugin\.md|\.github/workflows/waffo-payments-bootstrap\.yml)$' || true; })"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected changed paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: qualify Waffo payments plugin"
          git push origin "HEAD:${GITHUB_REF_NAME}"
