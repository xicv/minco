name: Export Minco research snapshot

on:
  push:
    branches:
      - tmp/research-snapshot-20260807

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Archive exact repository tree
        run: tar --exclude=.git -czf /tmp/minco-repository.tar.gz .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minco-research-snapshot
          path: /tmp/minco-repository.tar.gz
          if-no-files-found: error
          retention-days: 1
