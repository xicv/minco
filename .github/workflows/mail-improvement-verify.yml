name: Mail Clippy reconciliation

on:
  push:
    branches:
      - automation/mail-improvement-verify

permissions:
  contents: write

concurrency:
  group: mail-clippy-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/complete-mail-delivery
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply exact Clippy-driven source refinements
        run: |
          git show origin/automation/mail-improvement-verify:.github/mail-rebuild/patch_clippy.py > /tmp/patch_clippy.py
          printf '%s  %s\n' \
            '159aa927f50477606a7d5b5d6e4d181c05869b6b6e052bdb500c8ba40b6310ce' /tmp/patch_clippy.py \
            | sha256sum --check --strict
          python /tmp/patch_clippy.py
          rustfmt --edition 2024 \
            plugins/minco-plugin-notifications/src/lib.rs \
            plugins/minco-plugin-notifications/src/mail.rs \
            plugins/minco-plugin-notifications/src/mailpit.rs
          git diff --check
          changed=$(git status --short | awk '{print $2}' | sort | tr '\n' ' ')
          expected='plugins/minco-plugin-notifications/src/lib.rs plugins/minco-plugin-notifications/src/mail.rs plugins/minco-plugin-notifications/src/mailpit.rs '
          test "$changed" = "$expected"
      - name: Commit reconciled sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            plugins/minco-plugin-notifications/src/lib.rs \
            plugins/minco-plugin-notifications/src/mail.rs \
            plugins/minco-plugin-notifications/src/mailpit.rs
          git commit -m "refactor(mail): satisfy strict source policy"
          git push origin HEAD:agent/complete-mail-delivery
