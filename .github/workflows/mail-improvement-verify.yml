name: Mail implementation qualification

on:
  push:
    branches:
      - automation/mail-improvement-verify

permissions:
  contents: write

concurrency:
  group: mail-implementation-qualification
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/complete-mail-delivery
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false
          cache-on-failure: false
      - name: Format only modified Rust files
        run: |
          rustfmt --edition 2024 \
            plugins/minco-plugin-notifications/src/lib.rs \
            plugins/minco-plugin-notifications/src/mail.rs \
            plugins/minco-plugin-notifications/src/mailpit.rs \
            extensions/minco-aws-adapters/src/plugin.rs \
            extensions/minco-aws-adapters/src/ses.rs
          git diff --check
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add \
              plugins/minco-plugin-notifications/src/lib.rs \
              plugins/minco-plugin-notifications/src/mail.rs \
              plugins/minco-plugin-notifications/src/mailpit.rs \
              extensions/minco-aws-adapters/src/plugin.rs \
              extensions/minco-aws-adapters/src/ses.rs
            git commit -m "style(mail): format modified Rust sources"
            git push origin HEAD:agent/complete-mail-delivery
          fi
      - name: Test notification and mail contracts
        run: cargo test -p minco-plugin-notifications --all-features --locked
      - name: Lint notification and mail contracts
        run: cargo clippy -p minco-plugin-notifications --all-targets --all-features --locked -- -D warnings
      - name: Test SES adapter
        run: cargo test -p minco-aws-adapters --features ses --locked
      - name: Lint SES adapter
        run: cargo clippy -p minco-aws-adapters --all-targets --features ses --locked -- -D warnings
      - name: Build public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p minco-plugin-notifications -p minco-aws-adapters --features minco-aws-adapters/ses --no-deps --locked
      - name: Verify exact-file formatting and diff hygiene
        run: |
          rustfmt --edition 2024 --check \
            plugins/minco-plugin-notifications/src/lib.rs \
            plugins/minco-plugin-notifications/src/mail.rs \
            plugins/minco-plugin-notifications/src/mailpit.rs \
            extensions/minco-aws-adapters/src/plugin.rs \
            extensions/minco-aws-adapters/src/ses.rs
          git diff --check
