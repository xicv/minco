name: Mail staged-part export

on:
  push:
    branches:
      - automation/mail-improvement-verify

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Export mismatched source parts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mail-mismatched-parts
          path: |
            .github/mail-rebuild/src/mail.rs.part00
            .github/mail-rebuild/src/mail.rs.part01
          if-no-files-found: error
          retention-days: 1
