name: Mail lockfile reconciliation

on:
  push:
    branches:
      - automation/mail-improvement-verify

permissions:
  contents: write

concurrency:
  group: mail-lockfile-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/complete-mail-delivery
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Resolve only the declared dependency graph
        run: |
          before_lock=$(sha256sum Cargo.lock | awk '{print $1}')
          cargo metadata --format-version 1 >/dev/null
          after_lock=$(sha256sum Cargo.lock | awk '{print $1}')
          printf 'Cargo.lock before=%s after=%s\n' "$before_lock" "$after_lock"
          git diff --check
          changed=$(git status --short | awk '{print $2}')
          if [ -n "$changed" ] && [ "$changed" != "Cargo.lock" ]; then
            printf 'Unexpected files changed during lock reconciliation:\n%s\n' "$changed" >&2
            exit 1
          fi
          git diff -- Cargo.lock
      - name: Commit reconciled lockfile when required
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock was already current'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "chore(mail): reconcile lockfile"
          git push origin HEAD:agent/complete-mail-delivery
