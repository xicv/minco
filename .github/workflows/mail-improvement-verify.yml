name: Mail improvement repository export

on:
  push:
    branches:
      - automation/mail-improvement-verify

permissions:
  contents: read

concurrency:
  group: mail-improvement-repository-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Export exact branch snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minco-mail-branch-snapshot
          path: |
            .
            !.git/**
            !target/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
