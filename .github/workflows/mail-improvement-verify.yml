name: Mail SES lint reconciliation

on:
  push:
    branches:
      - automation/mail-improvement-verify

permissions:
  contents: write

concurrency:
  group: mail-ses-lint-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/complete-mail-delivery
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply exact SES Clippy refinements
        run: |
          git show origin/automation/mail-improvement-verify:.github/mail-rebuild/patch_ses_clippy.py > /tmp/patch_ses_clippy.py
          python -m py_compile /tmp/patch_ses_clippy.py
          python /tmp/patch_ses_clippy.py
          rustfmt --edition 2024 extensions/minco-aws-adapters/src/ses.rs
          git diff --check
          test "$(git status --short | awk '{print $2}')" = 'extensions/minco-aws-adapters/src/ses.rs'
      - name: Commit reconciled SES source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extensions/minco-aws-adapters/src/ses.rs
          git commit -m "refactor(mail): satisfy strict SES source policy"
          git push origin HEAD:agent/complete-mail-delivery
