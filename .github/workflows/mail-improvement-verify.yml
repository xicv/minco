name: Mail improvement source export

on:
  push:
    branches:
      - automation/mail-improvement-verify

permissions:
  contents: read

concurrency:
  group: mail-improvement-source-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Export exact review sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minco-mail-review-sources
          path: |
            plugins/minco-plugin-notifications/src/mail.rs
            plugins/minco-plugin-notifications/src/lib.rs
            plugins/minco-plugin-notifications/Cargo.toml
            plugins/minco-plugin-notifications/minco-plugin.json
            extensions/minco-aws-adapters/src/ses.rs
            extensions/minco-aws-adapters/src/plugin.rs
            extensions/minco-aws-adapters/Cargo.toml
            extensions/minco-aws-adapters/minco-plugin.json
            compose.mail.yml
          if-no-files-found: error
          retention-days: 1
