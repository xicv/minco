name: Mail improvement recovery

on:
  push:
    branches:
      - automation/mail-improvement-verify

permissions:
  contents: write

concurrency:
  group: mail-improvement-recovery
  cancel-in-progress: true

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Recover inspectable staged sources
        run: |
          python - <<'PY'
          import base64
          import binascii
          import glob
          import pathlib
          import tarfile

          alphabet = frozenset("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")
          chunks = []
          for name in sorted(glob.glob(".github/mail-patch/payload.tgz.b64.part*")):
              compact = "".join(pathlib.Path(name).read_text(encoding="utf-8").split())
              invalid = [character for character in compact if character not in alphabet]
              if invalid:
                  raise SystemExit(f"{name} contains invalid base64 characters")
              chunks.append(compact)

          payload = "".join(chunks)
          remainder = len(payload) % 4
          if remainder == 1:
              raise SystemExit(f"base64 payload has impossible length {len(payload)}")
          payload += "=" * ((4 - remainder) % 4)
          try:
              archive = base64.b64decode(payload, validate=True)
          except binascii.Error as error:
              raise SystemExit(f"invalid base64 payload: {error}") from error

          archive_path = pathlib.Path("/tmp/mail-payload.tgz")
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path, mode="r:gz") as bundle:
              members = bundle.getmembers()
              unsafe = [member.name for member in members if member.name.startswith("/") or ".." in pathlib.PurePosixPath(member.name).parts]
              if unsafe:
                  raise SystemExit(f"unsafe archive paths: {unsafe}")
              print("Recovered archive members:")
              for member in members:
                  print(member.name)
              bundle.extractall(".")
          PY
          git status --short
      - name: Commit recovered sources for review
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins/minco-plugin-notifications/src/mail.rs
          if [ -f extensions/minco-aws-adapters/src/ses.rs ]; then
            git add extensions/minco-aws-adapters/src/ses.rs
          fi
          git commit -m "chore(mail): recover staged sources for final review"
          git push
