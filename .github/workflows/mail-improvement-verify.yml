name: Mail repository qualification and generation

on:
  push:
    branches:
      - automation/mail-improvement-verify

permissions:
  contents: write

concurrency:
  group: mail-repository-qualification-generation
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/complete-mail-delivery-current
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install deterministic repository tools
        run: uv sync --locked --only-dev
      - name: Validate and exercise the local Mailpit inbox
        run: |
          set -euo pipefail
          cleanup() {
            docker compose -f compose.mail.yml logs --no-color || true
            docker compose -f compose.mail.yml down -v --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose -f compose.mail.yml config --quiet
          docker compose -f compose.mail.yml up -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8025/readyz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'Mailpit did not become ready' >&2
              exit 1
            fi
            sleep 1
          done
          MAIL_SUBJECT="Minco mail qualification ${GITHUB_SHA}"
          export MAIL_SUBJECT
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          message = EmailMessage()
          message['From'] = 'minco@localhost'
          message['To'] = 'person@example.com'
          message['Subject'] = os.environ['MAIL_SUBJECT']
          message.set_content('Minco local mail qualification body')
          with smtplib.SMTP('127.0.0.1', 1025, timeout=5) as smtp:
              smtp.send_message(message)
          PY
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8025/api/v1/message/latest > /tmp/mailpit-latest.json \
              && curl --fail --silent --show-error http://127.0.0.1:8025/view/latest.txt > /tmp/mailpit-latest.txt \
              && python - <<'PY'
          import json
          import os
          from pathlib import Path

          message = json.loads(Path('/tmp/mailpit-latest.json').read_text(encoding='utf-8'))
          if message.get('Subject') != os.environ['MAIL_SUBJECT']:
              raise SystemExit(1)
          PY
            then
              if grep -F 'Minco local mail qualification body' /tmp/mailpit-latest.txt; then
                break
              fi
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Mailpit did not expose the captured message' >&2
              cat /tmp/mailpit-latest.json || true
              cat /tmp/mailpit-latest.txt || true
              exit 1
            fi
            sleep 1
          done
          docker compose -f compose.mail.yml ps
      - name: Generate task, plugin reference, and source evidence
        run: |
          cargo build --quiet --locked -p cargo-minco
          export PATH="$PWD/target/debug:$PATH"
          cargo minco task graph --output roadmap/tasks.mmd
          scripts/docs/generate-reference.sh
          uv run --locked python scripts/source_manifest.py
      - name: Validate repository policy
        run: uv run --locked python scripts/validate_static.py
      - name: Verify modified Rust files
        run: |
          rustfmt --edition 2024 --check \
            plugins/minco-plugin-notifications/src/lib.rs \
            plugins/minco-plugin-notifications/src/mail.rs \
            plugins/minco-plugin-notifications/src/mailpit.rs \
            extensions/minco-aws-adapters/src/plugin.rs \
            extensions/minco-aws-adapters/src/ses.rs
          cargo test -p minco-plugin-notifications --all-features --locked
          cargo clippy -p minco-plugin-notifications --all-targets --all-features --locked -- -D warnings
          cargo test -p minco-aws-adapters --features ses --locked
          cargo clippy -p minco-aws-adapters --all-targets --features ses --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc -p minco-plugin-notifications --all-features --no-deps --locked
          RUSTDOCFLAGS='-D warnings' cargo doc -p minco-aws-adapters --features ses --no-deps --locked
      - name: Verify documentation
        run: |
          scripts/docs/check-snippets.sh
          scripts/docs/build.sh
          scripts/docs/check-links.sh
      - name: Check exact generated and source scope
        run: |
          git diff --check
          git status --short
          test -z "$(git status --short | grep '^??')"
      - name: Commit deterministic generated evidence
        run: |
          if git diff --quiet; then
            echo 'Generated evidence was already current'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/reference/generated/diagnostics.md \
            docs/reference/generated/schemas.md \
            roadmap/tasks.mmd \
            verification/source-manifest.json \
            verification/static-validation.json
          test -z "$(git status --short | grep '^??')"
          git commit -m "docs(mail): refresh generated repository evidence"
          git push origin HEAD:agent/complete-mail-delivery-current
