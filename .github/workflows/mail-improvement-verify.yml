name: Mail core payload diagnostics

on:
  push:
    branches:
      - automation/mail-improvement-verify

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Locate non-Base64 transport text
        run: |
          python - <<'PY'
          import pathlib
          import string

          path = pathlib.Path('.github/mail-rebuild/core.b64.part00')
          text = path.read_text(encoding='utf-8')
          allowed = set(string.ascii_letters + string.digits + '+/=\r\n\t ')
          invalid = [(index, character) for index, character in enumerate(text) if character not in allowed]
          print(f'length={len(text)} invalid_count={len(invalid)}')
          for index, character in invalid[:100]:
              start = max(0, index - 80)
              end = min(len(text), index + 160)
              print(f'index={index} char={character!r} context={text[start:end]!r}')
          if not invalid:
              print('no non-Base64 characters found')
          PY
