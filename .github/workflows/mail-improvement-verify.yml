name: Mail improvement verification

on:
  push:
    branches:
      - automation/mail-improvement-verify

permissions:
  contents: write

concurrency:
  group: mail-improvement-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false
          cache-on-failure: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Materialize bounded patch archive
        run: |
          python - <<'PY'
          import base64
          import binascii
          import glob
          import pathlib
          import tarfile

          alphabet = frozenset("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")
          chunks = []
          for name in sorted(glob.glob(".github/mail-patch/payload.tgz.b64.part*")):
              text = pathlib.Path(name).read_text(encoding="utf-8")
              compact = "".join(text.split())
              invalid = [(index, character, ord(character)) for index, character in enumerate(compact) if character not in alphabet]
              if invalid:
                  raise SystemExit(f"{name} contains invalid base64 characters: {invalid[:8]}")
              chunks.append(compact)

          payload = "".join(chunks)
          if len(payload) % 4:
              raise SystemExit(f"base64 payload length {len(payload)} is not divisible by four")
          try:
              archive = base64.b64decode(payload, validate=True)
          except binascii.Error as error:
              raise SystemExit(f"invalid base64 payload: {error}") from error

          archive_path = pathlib.Path("/tmp/mail-payload.tgz")
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path, mode="r:gz") as bundle:
              members = bundle.getmembers()
              unsafe = [member.name for member in members if member.name.startswith("/") or ".." in pathlib.PurePosixPath(member.name).parts]
              if unsafe:
                  raise SystemExit(f"unsafe archive paths: {unsafe}")
              bundle.extractall(".")
          PY
      - name: Format only changed Rust sources
        run: |
          rustfmt --edition 2024 \
            plugins/minco-plugin-notifications/src/lib.rs \
            plugins/minco-plugin-notifications/src/mail.rs \
            plugins/minco-plugin-notifications/src/mailpit.rs \
            extensions/minco-aws-adapters/src/plugin.rs \
            extensions/minco-aws-adapters/src/ses.rs
      - name: Validate JSON and local container definition
        run: |
          python -m json.tool plugins/minco-plugin-notifications/minco-plugin.json >/dev/null
          python -m json.tool extensions/minco-aws-adapters/minco-plugin.json >/dev/null
          docker compose -f compose.mail.yml config --quiet
      - name: Run targeted mail tests
        run: |
          cargo test -p minco-plugin-notifications
          cargo test -p minco-aws-adapters --features ses
      - name: Regenerate plugin reference and source evidence
        run: |
          uv sync --locked --only-dev
          scripts/docs/generate-reference.sh
          python scripts/source_manifest.py
      - name: Build documentation
        working-directory: docs-site
        run: |
          npm ci
          npm run build
      - name: Check exact-file formatting and locked reproducibility
        run: |
          rustfmt --edition 2024 --check \
            plugins/minco-plugin-notifications/src/lib.rs \
            plugins/minco-plugin-notifications/src/mail.rs \
            plugins/minco-plugin-notifications/src/mailpit.rs \
            extensions/minco-aws-adapters/src/plugin.rs \
            extensions/minco-aws-adapters/src/ses.rs
          cargo test -p minco-plugin-notifications --locked
          cargo test -p minco-aws-adapters --features ses --locked
          git diff --check
      - name: Commit verified clean tree
        if: ${{ github.actor != 'github-actions[bot]' }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -r .github/mail-patch .github/workflows/mail-improvement-verify.yml
          git add -A
          git commit -m "chore(mail): format and regenerate evidence"
          git push
