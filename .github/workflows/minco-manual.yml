name: Minco manual quality gates

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the local HTTP end-to-end test
        required: false
        default: false
        type: boolean
      run_rustack:
        description: Run Rustack AWS and Minco SSM adapter conformance
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Sync locked Python validation dependencies
        run: uv sync --locked --only-dev
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Static and packaging validation
        run: |
          uv run --locked python scripts/validate_static.py
          uv run --locked python scripts/validate_publish.py
          uv run --locked python scripts/deep_review.py
          uv run --locked python scripts/test/feedback_contract.py
          node --check plugins/minco-plugin-feedback/assets/widget.js
      - name: Format
        run: cargo fmt --all -- --check
      - name: Facade feature matrix
        run: |
          cargo check -p minco --no-default-features --locked
          cargo check -p minco --locked
          cargo check -p minco --all-features --locked
          cargo check -p cargo-minco --locked
          cargo test -p minco --no-default-features --locked
          cargo test -p minco --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Documentation
        run: |
          cargo rustdoc -p cargo-minco --lib --all-features --locked
          cargo doc --workspace --all-features --no-deps --locked
      - name: Publish dry run
        run: scripts/release/publish.sh --skip-quality
      - name: Rustack and Minco SSM adapter conformance
        if: ${{ inputs.run_rustack }}
        run: scripts/dev/rustack-smoke.sh
      - name: E2E
        if: ${{ inputs.run_e2e }}
        run: scripts/test/e2e.sh
