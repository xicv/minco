name: Minco manual quality gates

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the local HTTP end-to-end test
        required: false
        default: false
        type: boolean
      run_rustack:
        description: Run Rustack AWS and Minco SSM adapter conformance
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Sync locked Python validation dependencies
        run: uv sync --locked --only-dev
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install security and dependency tools
        run: |
          cargo install --locked cargo-deny --version 0.19.5
          cargo install --locked cargo-audit --version 0.22.2
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Authoritative quality gate
        run: ./scripts/quality.sh
      - name: Feedback browser matrix
        run: |
          npm ci --prefix plugins/minco-plugin-feedback
          npx --prefix plugins/minco-plugin-feedback playwright install --with-deps chromium firefox
          npm run --prefix plugins/minco-plugin-feedback test:browser
      - name: Publish dry run
        run: scripts/release/publish.sh --skip-quality
      - name: Rustack and Minco SSM adapter conformance
        if: ${{ inputs.run_rustack }}
        run: scripts/dev/rustack-smoke.sh
      - name: E2E
        if: ${{ inputs.run_e2e }}
        run: scripts/test/e2e.sh
