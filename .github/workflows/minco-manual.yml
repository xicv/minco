name: Minco manual quality gates

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the local HTTP end-to-end test
        required: false
        default: false
        type: boolean
      run_rustack:
        description: Exercise the AWS SSM adapter against Rustack
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Static and packaging validation
        run: |
          python3 scripts/validate_static.py
          python3 scripts/validate_publish.py
          python3 scripts/deep_review.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Facade feature matrix
        run: |
          cargo check -p minco --no-default-features --locked
          cargo check -p minco --locked
          cargo check -p minco --all-features --locked
          cargo check -p cargo-minco --locked
          cargo test -p minco --no-default-features --locked
          cargo test -p minco --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Documentation
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Publish dry run
        run: scripts/release/publish.sh --skip-quality
      - name: Rustack SSM adapter
        if: ${{ inputs.run_rustack }}
        run: scripts/dev/test-rustack.sh
      - name: E2E
        if: ${{ inputs.run_e2e }}
        run: scripts/test/e2e.sh
