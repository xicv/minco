name: Minco manual quality gates

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the local HTTP end-to-end test
        required: false
        default: false
        type: boolean
      run_rustack:
        description: Run Rustack AWS and Minco SSM adapter conformance
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Sync locked Python validation dependencies
        run: uv sync --locked --only-dev
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install pinned JJ
        run: |
          cargo install --locked --bin jj jj-cli --version 0.43.0
          jj --version
      - name: Install pinned ripgrep
        run: |
          cargo install --locked ripgrep --version 15.2.0
          rg --version
      - name: Install security and dependency tools
        run: |
          cargo install --locked cargo-deny --version 0.19.5
          cargo install --locked cargo-audit --version 0.22.2
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Authoritative quality gate
        run: ./scripts/quality.sh
      - name: Upload Feedback browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feedback-browser-${{ github.sha }}
          path: target/minco/feedback-browser/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish dry run
        run: scripts/release/publish.sh --skip-quality
      - name: Install pinned Cargo Lambda
        run: cargo install --locked cargo-lambda --version 1.9.1
      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.14.0"
      - name: Plan, SAM, and native ARM64 Lambda qualification
        run: |
          cargo lambda --version
          sam --version
          scripts/aws/plan.sh
          scripts/aws/validate.sh
          scripts/aws/build-lambda.sh
          scripts/aws/build-worker-lambda.sh
      - name: Rustack and Minco SSM adapter conformance
        if: ${{ inputs.run_rustack }}
        run: scripts/dev/rustack-smoke.sh
      - name: E2E
        if: ${{ inputs.run_e2e }}
        run: scripts/test/e2e.sh
