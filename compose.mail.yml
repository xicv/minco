name: minco-mail

services:
  mailpit:
    image: axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
    ports:
      - "127.0.0.1:${MINCO_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MINCO_MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
      MP_MAX_AGE: 7d
      MP_MAX_MESSAGE_SIZE: "40"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_STRICT_RFC_HEADERS: "true"
      MP_SMTP_MAX_RECIPIENTS: "50"
      MP_SMTP_DISABLE_RDNS: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 100
    volumes:
      - mailpit-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  mailpit-data:
