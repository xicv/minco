AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Minco deployment for minco-orders (dev)'
Parameters:
  LiveFunctionVersion:
    Type: String
    Default: candidate
    AllowedPattern: '^(candidate|[1-9][0-9]*)$'
    Description: Published API function version receiving live traffic; candidate is allowed only for initial deployment.
  DatabaseUrlParameterName:
    Type: String
    AllowedPattern: '^/[A-Za-z0-9_.\-/]+$'
    Description: Existing SSM SecureString containing the pooled runtime PostgreSQL URL.
  DatabaseUrlKmsKeyArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[a-z0-9-]+:kms:[a-z0-9-]+:[0-9]{12}:key/([A-Fa-f0-9-]+|mrk-[A-Fa-f0-9]+)$'
    Description: Customer-managed KMS key ARN for the database parameter; leave empty only when the AWS-managed aws/ssm key is used.
  LambdaSubnetIds:
    Type: String
    Default: ''
    AllowedPattern: '^$|^subnet-[a-z0-9]+(,subnet-[a-z0-9]+)*$'
    Description: Optional comma-separated private subnet IDs for an externally provisioned VPC database profile.
  LambdaSecurityGroupIds:
    Type: String
    Default: ''
    AllowedPattern: '^$|^sg-[a-z0-9]+(,sg-[a-z0-9]+)*$'
    Description: Optional comma-separated security group IDs paired with LambdaSubnetIds.
Rules:
  VpcParametersArePaired:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref LambdaSubnetIds, '']
            - !Equals [!Ref LambdaSecurityGroupIds, '']
          - !And
            - !Not [!Equals [!Ref LambdaSubnetIds, '']]
            - !Not [!Equals [!Ref LambdaSecurityGroupIds, '']]
        AssertDescription: LambdaSubnetIds and LambdaSecurityGroupIds must be set together.
Conditions:
  LiveFunctionVersionIsCandidate: !Equals [!Ref LiveFunctionVersion, 'candidate']
  UsesCustomerManagedDatabaseKey: !Not [!Equals [!Ref DatabaseUrlKmsKeyArn, '']]
  UsesVpc: !And
    - !Not [!Equals [!Ref LambdaSubnetIds, '']]
    - !Not [!Equals [!Ref LambdaSecurityGroupIds, '']]
Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      StageVariables:
        lambdaAlias: 'live'
      CorsConfiguration:
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders:
          - 'authorization'
          - 'content-type'
          - 'idempotency-key'
          - 'x-request-id'
        AllowOrigins:
          - 'https://app.example.invalid'
      Auth:
        Authorizers:
          JwtAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: 'https://issuer.example.invalid'
              audience:
                - 'minco-orders'
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: 'minco-orders-dev-promotion-api'
          version: '1.0'
        paths:
          '/health/live':
            get:
              operationId: 'getLive'
              responses:
                default:
                  description: Lambda proxy response
              x-amazon-apigateway-integration:
                httpMethod: POST
                payloadFormatVersion: '2.0'
                type: aws_proxy
                uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ApiFunction}:${!stageVariables.lambdaAlias}/invocations'
              security: []
          '/orders/{orderId}':
            get:
              operationId: 'getOrder'
              responses:
                default:
                  description: Lambda proxy response
              x-amazon-apigateway-integration:
                httpMethod: POST
                payloadFormatVersion: '2.0'
                type: aws_proxy
                uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ApiFunction}:${!stageVariables.lambdaAlias}/invocations'
              security:
                - JwtAuthorizer: []
          '/health/ready':
            get:
              operationId: 'getReady'
              responses:
                default:
                  description: Lambda proxy response
              x-amazon-apigateway-integration:
                httpMethod: POST
                payloadFormatVersion: '2.0'
                type: aws_proxy
                uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ApiFunction}:${!stageVariables.lambdaAlias}/invocations'
              security: []
          '/orders':
            post:
              operationId: 'placeOrder'
              responses:
                default:
                  description: Lambda proxy response
              x-amazon-apigateway-integration:
                httpMethod: POST
                payloadFormatVersion: '2.0'
                type: aws_proxy
                uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ApiFunction}:${!stageVariables.lambdaAlias}/invocations'
              security:
                - JwtAuthorizer: []
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: 'minco-orders-dev-api'
      CodeUri: '../../../target/lambda/orders-lambda/bootstrap.zip'
      AutoPublishAlias: candidate
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 15
      ReservedConcurrentExecutions: 2
      VpcConfig: !If
        - UsesVpc
        - SubnetIds: !Split [',', !Ref LambdaSubnetIds]
          SecurityGroupIds: !Split [',', !Ref LambdaSecurityGroupIds]
        - !Ref AWS::NoValue
      Environment:
        Variables:
          APP_ENV: 'dev'
          DATABASE_KIND: postgres
          DATABASE_URL_PARAMETER: !Ref DatabaseUrlParameterName
          DATABASE_MAX_CONNECTIONS: '2'
          ALLOWED_ORIGINS: 'https://app.example.invalid'
          ALLOW_DEVELOPMENT_HEADERS: 'false'
      Policies:
        - Statement:
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameterName}'
            - !If
              - UsesCustomerManagedDatabaseKey
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: !Ref DatabaseUrlKmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
                    kms:EncryptionContext:PARAMETER_ARN: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParameterName}'
              - !Ref AWS::NoValue
            - !If
              - UsesVpc
              - Effect: Allow
                Action:
                  - ec2:AssignPrivateIpAddresses
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
              - !Ref AWS::NoValue
  CandidateApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction.Alias
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'
  LiveFunctionAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Description: !Sub 'Minco live API routing target ${LiveFunctionVersion}'
      FunctionName: !Ref ApiFunction
      FunctionVersion: !If
        - LiveFunctionVersionIsCandidate
        - !GetAtt ApiFunction.Version.Version
        - !Ref LiveFunctionVersion
      Name: live
  LiveApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LiveFunctionAlias
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'
  CandidateStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      AutoDeploy: true
      StageName: candidate
      StageVariables:
        lambdaAlias: 'candidate'
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: 14
Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  CandidateApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/candidate'
  ApiFunctionName:
    Value: !Ref ApiFunction
  CandidateAliasName:
    Value: candidate
