[package]
name = "minco-plugin-payments-waffo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Signed Waffo Pancake checkout, payment API, and webhook integration for Minco"
documentation = "https://docs.rs/minco-plugin-payments-waffo"
readme = "README.md"
keywords = ["minco", "payments", "checkout", "webhook", "waffo"]
categories = ["web-programming", "api-bindings", "development-tools"]
publish = ["crates-io"]
include = [
  "src/**",
  "agent/**",
  "Cargo.toml",
  "minco-plugin.json",
  "README.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[package.metadata.minco]
plugin = "minco-plugin.json"

[features]
default = []
cli = [
  "dep:anyhow",
  "dep:aws-config",
  "dep:aws-sdk-ssm",
  "dep:clap",
  "dep:tokio",
  "dep:uuid",
]

[dependencies]
anyhow = { workspace = true, optional = true }
async-trait.workspace = true
aws-config = { workspace = true, optional = true }
aws-lc-rs.workspace = true
aws-sdk-ssm = { workspace = true, optional = true }
base64.workspace = true
chrono.workspace = true
clap = { workspace = true, optional = true }
minco-config.workspace = true
minco-core.workspace = true
minco-plugin-idempotency.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
url.workspace = true
uuid = { workspace = true, optional = true }
zeroize.workspace = true

[[bin]]
name = "minco-waffo"
path = "src/bin/minco-waffo.rs"
required-features = ["cli"]

[lints]
workspace = true
