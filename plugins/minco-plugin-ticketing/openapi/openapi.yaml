openapi: 3.1.0
info:
  title: Minco Ticketing Plugin API
  version: 0.1.0
  description: >-
    Project-scoped support entry, one-time handoff exchange, requester and agent
    ticket conversations, managed workflow, external ingress, and AI context.
x-minco-request-validation: generated
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /_minco/ticketing/support-entry.js:
    get:
      operationId: getTicketingSupportEntry
      summary: Get the dependency-free hardened support launcher
      security: []
      responses:
        '200':
          description: JavaScript launcher source
          content:
            application/javascript:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/bootstrap:
    get:
      operationId: getTicketingBootstrap
      summary: Get browser-safe support entry configuration
      security: []
      responses:
        '200':
          description: Browser-safe bootstrap without handoff credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupportBootstrap'}
              examples:
                default:
                  value:
                    schema_version: 1
                    project_id: example
                    portal_origin: https://support.example.test
                    label: Get support
                    brand: Support
                    enabled_surfaces: [widget, portal, api]
                    screenshot_enabled: false
                    voice_enabled: false
                    file_enabled: false
                    capabilities: {portal_sessions: false, history: true, files: false, screenshots: false, voice: false, knowledge: false, email: false, automation: false}
                    attachment_limits: {count: 8, screenshot_bytes: 4194304, audio_bytes: 5242880, file_bytes: 5242880, aggregate_bytes: 8388608}
                    recording_limit: 90
                    privacy_notice: Share only information needed to resolve this request.
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/integrations/handoffs:
    post:
      operationId: issueTicketingHandoff
      summary: Issue a short-lived handoff for a trusted integration principal
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssueHandoff'}
            examples:
              order:
                value:
                  project_id: example
                  requester_subject: user-42
                  requester_permissions: [ticketing.create, ticketing.read]
                  surface: widget
                  context: {page_url: https://app.example.test/orders/42}
                  return_location: https://app.example.test/orders/42
      responses:
        '200':
          description: Exact browser handoff contract
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedHandoff'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/handoffs/exchange:
    post:
      operationId: consumeTicketingHandoff
      summary: Atomically exchange one handoff and create or return its ticket result
      security: []
      parameters:
        - {$ref: '#/components/parameters/Handoff'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExchangeHandoff'}
            examples:
              browser:
                value:
                  project_id: example
                  portal_origin: https://support.example.test
                  subject: Order did not update
                  description: The status remains pending.
                  channel: portal
                  priority: normal
      responses:
        '200': {$ref: '#/components/responses/ConsumedHandoff'}
        '201': {$ref: '#/components/responses/ConsumedHandoff'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/tickets/from-handoff:
    post:
      operationId: createTicketFromHandoff
      summary: Compatibility route for atomic handoff exchange and ticket creation
      security: []
      parameters:
        - {$ref: '#/components/parameters/Handoff'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExchangeHandoff'}
      responses:
        '200': {$ref: '#/components/responses/ConsumedHandoff'}
        '201': {$ref: '#/components/responses/ConsumedHandoff'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/tickets:
    post:
      operationId: createTicket
      summary: Create a project-scoped ticket
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTicket'}
            examples:
              api:
                value:
                  project_id: example
                  subject: Cannot complete checkout
                  description: The final action returns an error.
                  requester: {subject: user-42}
                  channel: api
                  priority: high
                  resource_references: []
      responses:
        '201': {$ref: '#/components/responses/TicketMutation'}
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: listTickets
      summary: List tickets with bounded cursor pagination
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageAfter'}
        - in: query
          name: filter[status]
          schema: {$ref: '#/components/schemas/TicketStatus'}
        - in: query
          name: filter[queue_id]
          schema: {type: string, maxLength: 200}
        - in: query
          name: filter[assignee_subject]
          schema: {type: string, maxLength: 300}
        - in: query
          name: filter[requester_subject]
          schema: {type: string, maxLength: 300}
      responses:
        '200':
          description: Ticket page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketCollection'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/tickets/{ticketId}:
    get:
      operationId: getTicket
      summary: Get one agent-visible ticket
      parameters: [{$ref: '#/components/parameters/TicketId'}]
      responses:
        '200': {$ref: '#/components/responses/Ticket'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/tickets/{ticketId}/requester-replies:
    post:
      operationId: replyToTicketAsRequester
      summary: Add a requester-visible inbound reply
      parameters:
        - {$ref: '#/components/parameters/TicketId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/Reply'}
      responses:
        '200': {$ref: '#/components/responses/RequesterTicketMutation'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/tickets/{ticketId}/agent-replies:
    post:
      operationId: replyToTicketAsAgent
      summary: Add a public outbound agent reply
      parameters:
        - {$ref: '#/components/parameters/TicketId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/Reply'}
      responses:
        '200': {$ref: '#/components/responses/TicketMutation'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/tickets/{ticketId}/internal-notes:
    post:
      operationId: addTicketInternalNote
      summary: Add an agent-only internal note
      parameters:
        - {$ref: '#/components/parameters/TicketId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {$ref: '#/components/requestBodies/Reply'}
      responses:
        '200': {$ref: '#/components/responses/TicketMutation'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/tickets/{ticketId}/assignment:
    patch:
      operationId: changeTicketAssignment
      summary: Assign or unassign a ticket
      parameters:
        - {$ref: '#/components/parameters/TicketId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketAssignment'}
      responses:
        '200': {$ref: '#/components/responses/TicketMutation'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/tickets/{ticketId}/queue:
    patch:
      operationId: transferTicketQueue
      summary: Transfer a ticket to a queue
      parameters:
        - {$ref: '#/components/parameters/TicketId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketQueueTransfer'}
      responses:
        '200': {$ref: '#/components/responses/TicketMutation'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/tickets/{ticketId}/priority:
    patch:
      operationId: changeTicketPriority
      summary: Change ticket priority
      parameters:
        - {$ref: '#/components/parameters/TicketId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketPriorityChange'}
      responses:
        '200': {$ref: '#/components/responses/TicketMutation'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/tickets/{ticketId}/status:
    patch:
      operationId: changeTicketStatus
      summary: Apply an explicit ticket transition
      parameters:
        - {$ref: '#/components/parameters/TicketId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketStatusChange'}
      responses:
        '200': {$ref: '#/components/responses/TicketMutation'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/ingress/messages:
    post:
      operationId: ingestTicketExternalMessage
      summary: Ingest one verified external-provider message idempotently
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IngressMessage'}
      responses:
        '200': {$ref: '#/components/responses/TicketMutation'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/tickets/{ticketId}/ai-context:
    get:
      operationId: getTicketAiContext
      summary: Export deterministic agent context
      parameters: [{$ref: '#/components/parameters/TicketId'}]
      responses:
        '200':
          description: AI context
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketAiContext'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/agent:
    get:
      operationId: getTicketingAgentConsole
      summary: Get the dependency-free agent console page
      security: []
      responses:
        '200':
          description: Agent console HTML document
          content:
            text/html:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/agent/console.js:
    get:
      operationId: getTicketingAgentConsoleScript
      summary: Get the agent console script
      security: []
      responses:
        '200':
          description: Agent console JavaScript source
          content:
            application/javascript:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/agent/console.css:
    get:
      operationId: getTicketingAgentConsoleStyles
      summary: Get the agent console stylesheet
      security: []
      responses:
        '200':
          description: Agent console CSS source
          content:
            text/css:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/agent/bootstrap:
    get:
      operationId: getTicketingAgentBootstrap
      summary: Get truthful permission-derived agent console configuration
      responses:
        '200':
          description: Agent console bootstrap without secrets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentBootstrap'}
              examples:
                default:
                  value:
                    schema_version: 1
                    project_id: example
                    brand: Support
                    label: Get support
                    subject: agent-1
                    capabilities: {create: true, reply: true, internal_note: true, manage: true}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/agent/tickets:
    get:
      operationId: listTicketingAgentTickets
      summary: List compact newest-first ticket summaries for agents
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageAfter'}
        - in: query
          name: filter[status]
          schema:
            type: array
            items: {$ref: '#/components/schemas/TicketStatus'}
        - in: query
          name: filter[queue_id]
          schema: {type: string, maxLength: 200}
        - in: query
          name: filter[assignee_subject]
          schema: {type: string, maxLength: 300}
        - in: query
          name: filter[requester_subject]
          schema: {type: string, maxLength: 300}
      responses:
        '200':
          description: Compact ticket summaries ordered updated_at DESC, id DESC
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketSummaryCollection'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/agent/tickets/{ticketId}:
    get:
      operationId: getTicketingAgentTicket
      summary: Get one full ticket for the agent detail view with collision indication
      description: >-
        Records this agent's view and returns the ticket together with the
        other agents who viewed it recently (advisory only; If-Match on
        mutations remains the collision authority).
      parameters:
        - {$ref: '#/components/parameters/TicketId'}
      responses:
        '200': {$ref: '#/components/responses/AgentTicketDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/agent/views/{viewId}:
    get:
      operationId: listTicketingAgentView
      summary: List one of the five curated agent views newest-first
      description: >-
        Curated, server-defined views over ticket summaries. The view set
        is closed: new-unassigned, pending-requester, pending-internal,
        mine and recently-resolved. No ad-hoc query surface.
      parameters:
        - in: path
          name: viewId
          required: true
          schema: {$ref: '#/components/schemas/AgentCuratedView'}
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageAfter'}
      responses:
        '200':
          description: Curated view of compact ticket summaries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketSummaryCollection'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/agent/macros:
    get:
      operationId: listTicketingAgentMacros
      summary: List shared saved replies ordered by title
      responses:
        '200':
          description: Shared saved replies for the project
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentMacroCollection'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createTicketingAgentMacro
      summary: Create one shared saved reply
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAgentMacro'}
      responses:
        '201':
          description: Created saved reply
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentMacroMutation'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/agent/macros/{macroId}:
    patch:
      operationId: updateTicketingAgentMacro
      summary: Replace one shared saved reply revision-gated by If-Match
      description: >-
        Macros stay plain text the agent can edit before submitting a
        reply; the library is revision-aware (If-Match) so concurrent
        editors fail fast instead of overwriting.
      parameters:
        - in: path
          name: macroId
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAgentMacro'}
      responses:
        '200':
          description: Updated saved reply
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentMacroMutation'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/agent/tickets/{ticketId}/management:
    patch:
      operationId: manageTicketingAgentTicket
      summary: Apply one complete atomic management decision to a ticket
      parameters:
        - {$ref: '#/components/parameters/TicketId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentManagement'}
            examples:
              resolve-and-assign:
                value:
                  priority: high
                  assignee_subject: agent-2
                  queue_id: tier-2
                  status: resolved
                  resolution: Replaced the failing part and confirmed with the requester.
      responses:
        '200': {$ref: '#/components/responses/TicketMutation'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/requester/tickets:
    get:
      operationId: listTicketingRequesterTickets
      summary: List the authenticated requester's own tickets as public summaries
      description: >-
        Newest-first compact public summaries of the requester's own tickets.
        The requester filter is forcibly the authenticated subject.
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageAfter'}
        - in: query
          name: filter[status]
          schema:
            type: array
            items: {$ref: '#/components/schemas/RequesterStatus'}
      responses:
        '200':
          description: Public ticket summaries ordered updated_at DESC, id DESC
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, page]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/RequesterTicketSummary'}}
                  page:
                    type: object
                    additionalProperties: false
                    required: [hasMore, nextCursor]
                    properties:
                      hasMore: {type: boolean}
                      nextCursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/requester/tickets/{ticketId}:
    get:
      operationId: getTicketingRequesterTicket
      summary: Get one public ticket projection for its own requester
      parameters: [{$ref: '#/components/parameters/TicketId'}]
      responses:
        '200':
          description: Public ticket projection without internal data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequesterTicket'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/requester/tickets/{ticketId}/replies:
    post:
      operationId: replyToTicketingRequesterTicket
      summary: Reply to the requester's own ticket through the requester surface
      parameters:
        - {$ref: '#/components/parameters/TicketId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketReply'}
      responses:
        '200': {$ref: '#/components/responses/RequesterTicketMutation'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/requester/tickets/{ticketId}/messages:
    get:
      operationId: listTicketingRequesterMessages
      summary: Paginate the requester's public conversation newest-first
      description: >-
        Independent message pagination over the public projection; internal
        notes are never visible. Ordered created_at DESC, id DESC with the
        standard cursor.
      parameters:
        - {$ref: '#/components/parameters/TicketId'}
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageAfter'}
      responses:
        '200':
          description: Public messages ordered created_at DESC, id DESC
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, page]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/RequesterMessage'}}
                  page:
                    type: object
                    additionalProperties: false
                    required: [hasMore, nextCursor]
                    properties:
                      hasMore: {type: boolean}
                      nextCursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/requester/sessions:
    post:
      operationId: createTicketingRequesterSession
      summary: Atomically exchange a one-time handoff for a durable requester session
      description: >-
        Consumes the one-time handoff from the sensitive header, mints a
        requester portal session bound to the requester subject, project and
        portal origin, and sets a host-only Secure HttpOnly SameSite=Lax
        session cookie. Identical replays answer with the original grant.
      security: []
      parameters:
        - {$ref: '#/components/parameters/Handoff'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionExchange'}
            examples:
              browser:
                value:
                  portal_origin: https://support.example.test
      responses:
        '200':
          description: Identical replay of the original session grant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionGrant'}
        '201':
          description: Session issued; the bearer cookie is set exactly once
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionGrant'}
        default: {$ref: '#/components/responses/Problem'}
  /_minco/ticketing/requester/logout:
    post:
      operationId: endTicketingRequesterSession
      summary: Revoke the requester portal session
      parameters:
        - in: header
          name: X-Minco-CSRF
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Session revoked
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    TicketId:
      in: path
      name: ticketId
      required: true
      schema: {type: string, format: uuid}
    Handoff:
      in: header
      name: X-Minco-Ticketing-Handoff
      required: true
      description: One-time sensitive bearer; never send in a URL
      schema: {type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-fA-F]{64}$'}
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema: {type: string, pattern: '^"ticket:[0-9a-f-]+:[1-9][0-9]*"$'}
    PageLimit:
      in: query
      name: page[limit]
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    PageAfter:
      in: query
      name: page[after]
      schema: {type: string, maxLength: 512}
  requestBodies:
    Reply:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TicketReply'}
  responses:
    Problem:
      description: RFC 9457-style problem response with request ID
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    ConsumedHandoff:
      description: Atomic authoritative handoff result
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ConsumedHandoff'}
    Ticket:
      description: Ticket
      headers:
        ETag: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Ticket'}
    AgentTicketDetail:
      description: Agent ticket detail with advisory collision indication
      headers:
        ETag: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AgentTicketDetail'}
    TicketMutation:
      description: Updated ticket
      headers:
        ETag: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TicketMutation'}
    RequesterTicketMutation:
      description: Updated requester-safe ticket
      headers:
        ETag: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RequesterTicketMutation'}
  schemas:
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, requestId]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        requestId: {type: string}
        errors:
          type: [object, 'null']
          additionalProperties:
            type: array
            items: {type: string}
          x-minco-open-object:
            rationale: Validation field names are application-defined and each value is a list of public-safe messages.
    TicketPriority: {type: string, enum: [low, normal, high, urgent]}
    TicketChannel: {type: string, enum: [portal, email, api, voice, internal, other]}
    TicketType: {type: string, enum: [question, incident, problem, task]}
    TicketFormValueKind: {type: string, enum: [text, number, boolean, date_time]}
    TicketFormAnswer:
      type: object
      description: One typed form answer; `kind` selects the meaningful value slot and exactly one slot may be set.
      additionalProperties: false
      required: [field_id, kind]
      properties:
        field_id: {type: string, minLength: 1, maxLength: 64}
        kind: {$ref: '#/components/schemas/TicketFormValueKind'}
        text_value: {type: [string, 'null'], maxLength: 2000}
        number_value: {type: [integer, 'null']}
        boolean_value: {type: [boolean, 'null']}
    TicketStatus: {type: string, enum: [new, open, pending_requester, pending_internal, on_hold, resolved, closed]}
    TicketClockState: {type: string, enum: [open, paused, stopped]}
    TicketMessageKind: {type: string, enum: [public_reply, internal_note, system_event, voice_transcript]}
    TicketMessageDirection: {type: string, enum: [inbound, outbound, internal, system]}
    AttachmentKind: {type: string, enum: [screenshot, audio, file]}
    SupportSurface: {type: string, enum: [widget, portal, extension, api, mobile]}
    AttachmentLimits:
      type: object
      additionalProperties: false
      required: [count, screenshot_bytes, audio_bytes, file_bytes, aggregate_bytes]
      properties:
