[package]
name = "minco-plugin-object-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Provider-neutral object storage port and reference memory implementation for Minco"
documentation = "https://docs.rs/minco-plugin-object-storage"
readme = "README.md"
keywords = ["minco", "storage", "s3", "uploads"]
categories = ["web-programming", "filesystem"]
publish = ["crates-io"]
include = ["src/**", "tests/**", "openapi/**", "Cargo.toml", "minco-plugin.json", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.minco]
plugin = "minco-plugin.json"

[features]
default = ["http"]
http = ["dep:axum", "dep:http", "dep:minco-http"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
minco-core.workspace = true
semver.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }
minco-http = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tower.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
