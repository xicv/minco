[package]
name = "minco-plugin-notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Provider-neutral notification and rich outbound mail ports with deterministic local test adapters for Minco"
documentation = "https://docs.rs/minco-plugin-notifications"
readme = "README.md"
keywords = ["minco", "notifications", "email", "webhook"]
categories = ["web-programming"]
publish = ["crates-io"]
include = ["src/**", "examples/**", "scripts/**", "Cargo.toml", "minco-plugin.json", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.minco]
plugin = "minco-plugin.json"

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
minco-core.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
mail-parser = "0.11.5"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
