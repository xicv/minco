<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="title desc">
  <title id="title">Minco contract-to-runtime system</title>
  <desc id="desc">A Minco OpenAPI contract flows through an application graph into local, HTTP API, and queue worker runtimes, while Plan IR and release evidence stay connected.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2A3641" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#05080B" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="780" height="560" rx="42" fill="#10151D"/>
  <rect x="1.5" y="1.5" width="777" height="557" rx="40.5" fill="none" stroke="#2B3742" stroke-width="3"/>
  <rect x="28" y="28" width="724" height="504" rx="26" fill="url(#grid)"/>
  <text x="58" y="70" fill="#93A29C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2.4">CONTRACT-TO-CLOUD GRAPH</text>
  <circle cx="660" cy="65" r="8" fill="#B8F34A"/>
  <text x="678" y="70" fill="#B8F34A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">READY</text>

  <path d="M226 174H286" stroke="#B8F34A" stroke-width="4" stroke-linecap="round"/>
  <path d="M482 174H526M504 174V118M504 174V230M504 174V342" fill="none" stroke="#42CFC1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M388 254V404" stroke="#75837D" stroke-width="3" stroke-dasharray="7 9" stroke-linecap="round"/>
  <path d="M480 447H536" stroke="#B8F34A" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="58" y="112" width="168" height="124" rx="18" fill="#151F29" stroke="#B8F34A" stroke-width="2"/>
    <text x="82" y="143" fill="#B8F34A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.7">01 · CONTRACT</text>
    <text x="82" y="180" fill="#F4F6F1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="750">OpenAPI</text>
    <text x="82" y="207" fill="#9EACA6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">3.1 · schemas · policy</text>

    <rect x="286" y="92" width="196" height="162" rx="20" fill="#F4F6F1" stroke="#F4F6F1" stroke-width="2"/>
    <text x="312" y="126" fill="#477718" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.7">02 · APPLICATION GRAPH</text>
    <text x="312" y="166" fill="#10151D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="780">Domain + ports</text>
    <text x="312" y="196" fill="#4A5862" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">handlers · adapters</text>
    <rect x="312" y="215" width="113" height="20" rx="10" fill="#DDE6D8"/>
    <text x="368.5" y="229" fill="#355D10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" text-anchor="middle">STATIC COMPOSITION</text>

    <rect x="526" y="86" width="196" height="72" rx="15" fill="#151F29" stroke="#3B4A55"/>
    <text x="548" y="113" fill="#42CFC1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5">LOCAL</text>
    <text x="548" y="139" fill="#F4F6F1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="720">SQLite + Postgres</text>

    <rect x="526" y="194" width="196" height="72" rx="15" fill="#151F29" stroke="#3B4A55"/>
    <text x="548" y="221" fill="#42CFC1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5">HTTP API</text>
    <text x="548" y="247" fill="#F4F6F1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="720">Gateway + Lambda</text>

    <rect x="526" y="306" width="196" height="72" rx="15" fill="#151F29" stroke="#3B4A55"/>
    <text x="548" y="333" fill="#42CFC1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5">QUEUE WORKER</text>
    <text x="548" y="359" fill="#F4F6F1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="720">SQS + Lambda</text>

    <rect x="58" y="296" width="424" height="108" rx="18" fill="#151F29" stroke="#3B4A55"/>
    <text x="84" y="329" fill="#F1BD55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.7">03 · PLAN IR</text>
    <text x="84" y="365" fill="#F4F6F1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="750">IAM · wake sources · cost classes</text>
    <text x="84" y="389" fill="#9EACA6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">review topology before provider mutation</text>

    <rect x="58" y="432" width="422" height="72" rx="16" fill="#151F29" stroke="#3B4A55"/>
    <text x="82" y="460" fill="#B8F34A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5">AT REST</text>
    <text x="82" y="487" fill="#F4F6F1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="760">0 provisioned application compute</text>

    <rect x="536" y="414" width="186" height="90" rx="17" fill="#B8F34A"/>
    <text x="558" y="444" fill="#355D10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5">04 · EVIDENCE</text>
    <text x="558" y="474" fill="#10151D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800">Exact release</text>
    <text x="558" y="493" fill="#355D10" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">digests · receipts · proof</text>
  </g>

  <circle cx="226" cy="174" r="7" fill="#B8F34A"/>
  <circle cx="286" cy="174" r="7" fill="#B8F34A"/>
  <circle cx="482" cy="174" r="7" fill="#42CFC1"/>
  <circle cx="526" cy="118" r="7" fill="#42CFC1"/>
  <circle cx="526" cy="230" r="7" fill="#42CFC1"/>
  <circle cx="526" cy="342" r="7" fill="#42CFC1"/>
</svg>
