<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" role="img" aria-labelledby="title desc" style="display:block;max-width:100%;height:auto;margin:0 auto">
  <title id="title">Minco contract-to-runtime system</title>
  <desc id="desc">A Minco OpenAPI contract flows through an application graph into local, HTTP API, and queue worker runtimes, while Plan IR and release evidence stay connected.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2A3641" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#05080B" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="860" height="540" rx="42" fill="#10151D"/>
  <rect x="1.5" y="1.5" width="857" height="537" rx="40.5" fill="none" stroke="#2B3742" stroke-width="3"/>
  <rect x="30" y="30" width="800" height="480" rx="26" fill="url(#grid)"/>

  <text x="60" y="68" fill="#93A29C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2.4">CONTRACT-TO-CLOUD GRAPH</text>
  <circle cx="744" cy="63" r="8" fill="#B8F34A"/>
  <text x="762" y="68" fill="#B8F34A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">READY</text>

  <g aria-hidden="true">
    <path d="M240 170H286" stroke="#B8F34A" stroke-width="4" stroke-linecap="round"/>
    <path d="M506 170H538M538 129V341M538 129H570M538 235H570M538 341H570" fill="none" stroke="#42CFC1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M396 250V282M396 390V414" stroke="#75837D" stroke-width="3" stroke-dasharray="7 9" stroke-linecap="round"/>
    <path d="M506 451H570" stroke="#B8F34A" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <g data-node="contract">
      <rect x="60" y="112" width="180" height="116" rx="18" fill="#151F29" stroke="#B8F34A" stroke-width="2"/>
      <text x="84" y="143" fill="#B8F34A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.7">01 · CONTRACT</text>
      <text x="84" y="178" fill="#F4F6F1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="750">OpenAPI</text>
      <text x="84" y="204" fill="#9EACA6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">3.1 · schemas · policy</text>
    </g>

    <g data-node="application">
      <rect x="286" y="92" width="220" height="158" rx="20" fill="#F4F6F1" stroke="#F4F6F1" stroke-width="2"/>
      <text x="310" y="125" fill="#477718" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.45">02 · APPLICATION GRAPH</text>
      <text x="310" y="165" fill="#10151D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="780">Domain + ports</text>
      <text x="310" y="195" fill="#4A5862" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">handlers · adapters</text>
      <rect x="310" y="213" width="118" height="20" rx="10" fill="#DDE6D8"/>
      <text x="369" y="227" fill="#355D10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" text-anchor="middle">STATIC COMPOSITION</text>
    </g>

    <g data-node="runtime-local">
      <rect x="570" y="92" width="226" height="74" rx="16" fill="#151F29" stroke="#3B4A55"/>
      <text x="594" y="119" fill="#42CFC1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5">LOCAL</text>
      <text x="594" y="145" fill="#F4F6F1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="720">SQLite + PostgreSQL</text>
    </g>

    <g data-node="runtime-http">
      <rect x="570" y="198" width="226" height="74" rx="16" fill="#151F29" stroke="#3B4A55"/>
      <text x="594" y="225" fill="#42CFC1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5">HTTP API</text>
      <text x="594" y="251" fill="#F4F6F1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="720">API Gateway + Lambda</text>
    </g>

    <g data-node="runtime-queue">
      <rect x="570" y="304" width="226" height="74" rx="16" fill="#151F29" stroke="#3B4A55"/>
      <text x="594" y="331" fill="#42CFC1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5">QUEUE WORKER</text>
      <text x="594" y="357" fill="#F4F6F1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="720">SQS + Lambda</text>
    </g>

    <g data-node="plan">
      <rect x="60" y="282" width="446" height="108" rx="18" fill="#151F29" stroke="#3B4A55"/>
      <text x="86" y="315" fill="#F1BD55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.7">03 · PLAN IR</text>
      <text x="86" y="351" fill="#F4F6F1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="750">IAM · wake sources · cost classes</text>
      <text x="86" y="377" fill="#9EACA6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">review topology before provider mutation</text>
    </g>

    <g data-node="idle">
      <rect x="60" y="414" width="446" height="74" rx="16" fill="#151F29" stroke="#3B4A55"/>
      <text x="84" y="442" fill="#B8F34A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5">AT REST</text>
      <text x="84" y="470" fill="#F4F6F1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="760">0 provisioned application compute</text>
    </g>

    <g data-node="evidence">
      <rect x="570" y="414" width="226" height="74" rx="16" fill="#B8F34A"/>
      <text x="594" y="440" fill="#355D10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5">04 · EVIDENCE</text>
      <text x="594" y="465" fill="#10151D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="800">Exact release</text>
      <text x="594" y="483" fill="#355D10" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">digests · receipts · proof</text>
    </g>
  </g>

  <circle cx="240" cy="170" r="7" fill="#B8F34A"/>
  <circle cx="286" cy="170" r="7" fill="#B8F34A"/>
  <circle cx="506" cy="170" r="7" fill="#42CFC1"/>
  <circle cx="570" cy="129" r="7" fill="#42CFC1"/>
  <circle cx="570" cy="235" r="7" fill="#42CFC1"/>
  <circle cx="570" cy="341" r="7" fill="#42CFC1"/>
</svg>
