[package]
name = "cargo-minco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cargo subcommand for Minco contracts, plugins, tests, plans, releases, updates, and JJ workflows"
documentation = "https://docs.rs/cargo-minco"
readme = "README.md"
keywords = ["minco", "cargo", "openapi", "aws", "serverless"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = ["src/**", "templates/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
default-run = "cargo-minco"
[[bin]]
name = "cargo-minco"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
minco-contract.workspace = true
minco-core.workspace = true
minco-plan.workspace = true
minco-plugin-feedback = { workspace = true, default-features = false, features = ["client"] }
minco-release.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3.20"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
