[package]
name = "cargo-minco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cargo subcommand for Minco local development, contracts, plugins, plans, releases, and JJ workflows"
documentation = "https://docs.rs/cargo-minco"
readme = "README.md"
keywords = ["minco", "cargo", "openapi", "aws", "serverless"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = ["src/**", "templates/**", "tests/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
default-run = "cargo-minco"
[[bin]]
name = "cargo-minco"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aws-config.workspace = true
aws-sdk-cloudfront.workspace = true
aws-sdk-s3.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
minco = { workspace = true, features = ["official-plugins"] }
minco-config.workspace = true
minco-contract.workspace = true
minco-core.workspace = true
minco-db.workspace = true
minco-deploy-aws.workspace = true
minco-aws-adapters = { workspace = true, features = ["static-site"] }
minco-dev.workspace = true
minco-plan.workspace = true
minco-project-view.workspace = true
minco-mcp.workspace = true
minco-workbench.workspace = true
minco-plugin-feedback = { workspace = true, default-features = false, features = ["client"] }
minco-release.workspace = true
minco-sqlx-postgres.workspace = true
minco-sqlx-sqlite.workspace = true
minco-test.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true
url.workspace = true

[dev-dependencies]
tempfile = "3.20"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
