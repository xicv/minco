schema_version = 2
application = "orders"
environment = "test"
region = "ap-southeast-2"
runtime = "lambda_zip_arm64"
ingress = "api_gateway_http_api"
allowed_origins = ["https://app.example.invalid"]
scheduled_wakeups = []
uses_nat_gateway = false

[auth]
kind = "jwt"
issuer = "https://issuer.example.invalid"
audiences = ["orders"]

[database]
kind = "neon_postgres"
plan = "free"
compute_unit_hours = 0.0
storage_gb_month = 0.0
history_storage_gb_month = 0.0

[[functions]]
name = "api"
role = "http_api"
artifact_path = "target/lambda/orders-lambda/bootstrap.zip"
memory_mb = 512
timeout_seconds = 15
reserved_concurrency = 2
provisioned_concurrency = 0
database_connections_per_instance = 2

[[functions]]
name = "orders-worker"
role = "worker"
artifact_path = "target/lambda/sqs_worker/bootstrap.zip"
memory_mb = 256
timeout_seconds = 30
reserved_concurrency = 2
provisioned_concurrency = 0
database_connections_per_instance = 1

[[queues]]
id = "orders"
fifo = true
visibility_timeout_seconds = 180
retention_seconds = 345600
dead_letter_queue_id = "orders-dlq"
max_receive_count = 5

[[queues]]
id = "orders-dlq"
fifo = true
visibility_timeout_seconds = 180
retention_seconds = 1209600

[[triggers]]
kind = "http_api"
id = "api"
function_id = "api"

[[triggers]]
kind = "sqs"
id = "orders"
function_id = "orders-worker"
queue_id = "orders"
batch_size = 10
batching_window_seconds = 0
report_batch_item_failures = true
maximum_concurrency = 2
