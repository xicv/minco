default-features = false
features = [
    "json",
    "multipart",
    "rustls",
]
version = "0.13"

[workspace.dependencies.rmcp]
default-features = false
features = [
    "macros",
    "server",
    "transport-io",
]
version = "3.1.2"

[workspace.dependencies.rustix]
features = ["process"]
version = "1.1.4"

[workspace.dependencies.semver]
features = ["serde"]
version = "1.0"

[workspace.dependencies.serde]
features = ["derive"]
version = "1.0"

[workspace.dependencies.sqlx]
default-features = false
features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "uuid",
    "chrono",
    "json",
    "migrate",
]
version = "0.9.0"

[workspace.dependencies.tokio]
features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
    "sync",
    "net",
    "process",
    "fs",
    "io-util",
]
version = "1.53"

[workspace.dependencies.tower]
features = [
    "util",
    "timeout",
]
version = "0.5.3"

[workspace.dependencies.tower-http]
features = [
    "compression-gzip",
    "cors",
    "limit",
    "request-id",
    "sensitive-headers",
    "timeout",
    "trace",
]
version = "0.7.0"

[workspace.dependencies.tracing-subscriber]
features = [
    "env-filter",
    "json",
]
version = "0.3"

[workspace.dependencies.uuid]
features = [
    "v4",
    "v5",
    "v7",
    "serde",
]
version = "1"

[workspace.lints.clippy]
future_not_send = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
too_many_lines = "allow"

[workspace.lints.clippy.all]
level = "warn"
priority = -1

[workspace.lints.clippy.nursery]
level = "warn"
priority = -1

[workspace.lints.clippy.pedantic]
level = "warn"
priority = -1

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

