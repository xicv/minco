[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[workspace]
default-members = [
    "crates/minco",
    "crates/minco-cli",
    "crates/minco-config",
    "crates/minco-contract",
    "crates/minco-core",
    "crates/minco-db",
    "crates/minco-deploy-aws",
    "crates/minco-dev",
    "crates/minco-http",
    "crates/minco-interaction",
    "crates/minco-mcp",
    "crates/minco-plan",
    "crates/minco-project-view",
    "crates/minco-release",
    "crates/minco-test",
    "crates/minco-workbench",
    "examples/orders/adapters",
    "examples/orders/api",
    "examples/orders/application",
    "examples/orders/domain",
    "examples/orders/service",
    "extensions/minco-aws-adapters",
    "extensions/minco-aws-dynamodb",
    "extensions/minco-aws-lambda",
    "extensions/minco-aws-worker",
    "extensions/minco-sqlx-postgres",
    "extensions/minco-sqlx-sqlite",
    "plugins/minco-plugin-audit",
    "plugins/minco-plugin-events",
    "plugins/minco-plugin-feedback",
    "plugins/minco-plugin-health",
    "plugins/minco-plugin-idempotency",
    "plugins/minco-plugin-identity",
    "plugins/minco-plugin-jobs",
    "plugins/minco-plugin-notifications",
    "plugins/minco-plugin-object-storage",
    "plugins/minco-plugin-observability",
    "plugins/minco-plugin-payments-waffo",
    "plugins/minco-plugin-realtime",
    "plugins/minco-plugin-sessions",
    "plugins/minco-plugin-static-site",
    "plugins/minco-plugin-ticketing",
    "plugins/minco-plugin-workspace",
]
members = [
    "crates/minco",
    "crates/minco-cli",
    "crates/minco-config",
    "crates/minco-contract",
    "crates/minco-core",
    "crates/minco-db",
    "crates/minco-deploy-aws",
    "crates/minco-dev",
    "crates/minco-http",
    "crates/minco-interaction",
    "crates/minco-mcp",
    "crates/minco-plan",
    "crates/minco-project-view",
    "crates/minco-release",
    "crates/minco-test",
    "crates/minco-workbench",
    "examples/minco-desk",
    "examples/orders/adapters",
    "examples/orders/api",
    "examples/orders/application",
    "examples/orders/domain",
    "examples/orders/service",
    "extensions/minco-aws-adapters",
    "extensions/minco-aws-dynamodb",
    "extensions/minco-aws-lambda",
    "extensions/minco-aws-worker",
    "extensions/minco-sqlx-postgres",
    "extensions/minco-sqlx-sqlite",
    "plugins/minco-plugin-audit",
    "plugins/minco-plugin-events",
    "plugins/minco-plugin-feedback",
    "plugins/minco-plugin-health",
    "plugins/minco-plugin-idempotency",
    "plugins/minco-plugin-identity",
    "plugins/minco-plugin-jobs",
    "plugins/minco-plugin-notifications",
    "plugins/minco-plugin-object-storage",
    "plugins/minco-plugin-observability",
    "plugins/minco-plugin-payments-waffo",
    "plugins/minco-plugin-realtime",
    "plugins/minco-plugin-sessions",
    "plugins/minco-plugin-static-site",
    "plugins/minco-plugin-ticketing",
    "plugins/minco-plugin-workspace",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
apollo-parser = "0.8.6"
async-trait = "0.1"
aws-credential-types = "1.3"
aws-lc-rs = "1.18.0"
aws-sigv4 = "1.5.1"
base64 = "0.23"
futures = "0.3"
hex = "0.4.3"
hmac = "0.13"
http = "1.5"
http-body-util = "0.1"
lambda_runtime = "1.3.0"
serde_json = "1.0"
serde_urlencoded = "0.7"
serde_yaml_ng = "0.10"
sha2 = "0.11"
subtle = "2.6"
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1"
tracing = "0.1"
url = "2.5.8"
walkdir = "2.5"
zeroize = "1.9"

[workspace.dependencies.aws-config]
default-features = false
features = [
    "credentials-process",
    "default-https-client",
    "rt-tokio",
]
version = "1.10"

[workspace.dependencies.aws-sdk-cloudfront]
default-features = false
features = [
    "default-https-client",
    "rt-tokio",
]
version = "1.126.0"

[workspace.dependencies.aws-sdk-cognitoidentityprovider]
default-features = false
features = [
    "default-https-client",
    "rt-tokio",
]
version = "1.127.0"

[workspace.dependencies.aws-sdk-dynamodb]
default-features = false
features = [
    "default-https-client",
    "rt-tokio",
]
version = "1.120.0"

[workspace.dependencies.aws-sdk-s3]
default-features = false
features = [
    "default-https-client",
    "http-1x",
    "rt-tokio",
]
version = "1.141.0"

[workspace.dependencies.aws-sdk-sesv2]
default-features = false
features = [
    "default-https-client",
    "rt-tokio",
]
version = "1.128.0"

[workspace.dependencies.aws-sdk-sqs]
default-features = false
features = [
    "default-https-client",
    "rt-tokio",
]
