[workspace]
resolver = "3"
members = [
  "crates/minco",
  "crates/minco-config",
  "crates/minco-db",
  "crates/minco-dev",
  "crates/minco-core",
  "crates/minco-contract",
  "crates/minco-deploy-aws",
  "crates/minco-plan",
  "crates/minco-project-view",
  "crates/minco-mcp",
  "crates/minco-workbench",
  "crates/minco-release",
  "crates/minco-http",
  "crates/minco-test",
  "crates/minco-cli",
  "plugins/minco-plugin-health",
  "plugins/minco-plugin-observability",
  "plugins/minco-plugin-idempotency",
  "plugins/minco-plugin-payments-waffo",
  "plugins/minco-plugin-sessions",
  "plugins/minco-plugin-identity",
  "plugins/minco-plugin-object-storage",
  "plugins/minco-plugin-events",
  "plugins/minco-plugin-notifications",
  "plugins/minco-plugin-audit",
  "plugins/minco-plugin-feedback",
  "plugins/minco-plugin-static-site",
  "plugins/minco-plugin-realtime",
  "extensions/minco-sqlx-postgres",
  "extensions/minco-sqlx-sqlite",
  "extensions/minco-aws-adapters",
  "extensions/minco-aws-dynamodb",
  "extensions/minco-aws-lambda",
  "extensions/minco-aws-worker",
  "examples/orders/domain",
  "examples/orders/application",
  "examples/orders/adapters",
  "examples/orders/api",
  "examples/orders/service",
]
default-members = [
  "crates/minco",
  "crates/minco-config",
  "crates/minco-db",
  "crates/minco-dev",
  "crates/minco-core",
  "crates/minco-contract",
  "crates/minco-deploy-aws",
  "crates/minco-plan",
  "crates/minco-project-view",
  "crates/minco-mcp",
  "crates/minco-workbench",
  "crates/minco-release",
  "crates/minco-http",
  "crates/minco-test",
  "crates/minco-cli",
  "plugins/minco-plugin-health",
  "plugins/minco-plugin-observability",
  "plugins/minco-plugin-idempotency",
  "plugins/minco-plugin-payments-waffo",
  "plugins/minco-plugin-sessions",
  "plugins/minco-plugin-identity",
  "plugins/minco-plugin-object-storage",
  "plugins/minco-plugin-events",
  "plugins/minco-plugin-notifications",
  "plugins/minco-plugin-audit",
  "plugins/minco-plugin-feedback",
  "plugins/minco-plugin-static-site",
  "plugins/minco-plugin-realtime",
  "extensions/minco-sqlx-postgres",
  "extensions/minco-sqlx-sqlite",
  "extensions/minco-aws-adapters",
  "extensions/minco-aws-dynamodb",
  "extensions/minco-aws-lambda",
  "extensions/minco-aws-worker",
  "examples/orders/domain",
  "examples/orders/application",
  "examples/orders/adapters",
  "examples/orders/api",
  "examples/orders/service",
]

[workspace.package]
version = "1.6.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
authors = ["Minco Contributors"]
repository = "https://github.com/xicv/minco"
homepage = "https://github.com/xicv/minco"

[workspace.dependencies]
anyhow = "1.0"
apollo-parser = "0.8.6"
async-trait = "0.1"
aws_lambda_events = { version = "1.2.0", default-features = false, features = ["sqs"] }
aws-config = { version = "1.10", default-features = false, features = ["credentials-process", "default-https-client", "rt-tokio"] }
aws-credential-types = "1.3"
aws-lc-rs = "1.18.0"
aws-sigv4 = "1.5.1"
aws-sdk-cloudfront = { version = "1.126.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cognitoidentityprovider = { version = "1.127.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1.120.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.141.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio"] }
aws-sdk-sesv2 = { version = "1.128.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1.105.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.110.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum = { version = "0.8.9", features = ["json", "macros"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
http = "1.5"
http-body-util = "0.1"
hmac = "0.13"
hex = "0.4.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
rmcp = { version = "3.1.2", default-features = false, features = ["macros", "server", "transport-io"] }
rustix = { version = "1.1.4", features = ["process"] }
lambda_http = { version = "1.3.0", default-features = false, features = ["apigw_http", "tracing"] }
lambda_runtime = "1.3.0"
futures = "0.3"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
serde_yaml_ng = "0.10"
sha2 = "0.11"
subtle = "2.6"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "uuid",
  "chrono",
  "json",
  "migrate",
] }
thiserror = "2.0"
tempfile = "3.27"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "process", "fs", "io-util"] }
toml = "1.1"
tower = { version = "0.5.3", features = ["util", "timeout"] }
tower-http = { version = "0.7.0", features = [
  "compression-gzip",
  "cors",
  "limit",
  "request-id",
  "sensitive-headers",
  "timeout",
  "trace",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
url = "2.5.8"
walkdir = "2.5"
zeroize = "1.9"

# Every publishable path dependency carries an explicit version. Cargo removes
# the path when packaging and resolves the version from the target registry.
minco = { version = "1.6.0", path = "crates/minco", default-features = false }
minco-config = { version = "1.6.0", path = "crates/minco-config" }
minco-db = { version = "1.6.0", path = "crates/minco-db" }
minco-dev = { version = "1.6.0", path = "crates/minco-dev" }
minco-core = { version = "1.6.0", path = "crates/minco-core" }
minco-contract = { version = "1.6.0", path = "crates/minco-contract" }
minco-deploy-aws = { version = "1.6.0", path = "crates/minco-deploy-aws" }
minco-plan = { version = "1.6.0", path = "crates/minco-plan" }
minco-project-view = { version = "1.6.0", path = "crates/minco-project-view" }
minco-mcp = { version = "1.6.0", path = "crates/minco-mcp" }
minco-workbench = { version = "1.6.0", path = "crates/minco-workbench" }
minco-release = { version = "1.6.0", path = "crates/minco-release" }
minco-http = { version = "1.6.0", path = "crates/minco-http" }
minco-test = { version = "1.6.0", path = "crates/minco-test" }
minco-plugin-health = { version = "1.6.0", path = "plugins/minco-plugin-health" }
minco-plugin-observability = { version = "1.6.0", path = "plugins/minco-plugin-observability" }
minco-plugin-idempotency = { version = "1.6.0", path = "plugins/minco-plugin-idempotency" }
minco-plugin-payments-waffo = { version = "1.6.0", path = "plugins/minco-plugin-payments-waffo", default-features = false }
minco-plugin-sessions = { version = "1.6.0", path = "plugins/minco-plugin-sessions" }
minco-plugin-identity = { version = "1.6.0", path = "plugins/minco-plugin-identity" }
minco-plugin-object-storage = { version = "1.6.0", path = "plugins/minco-plugin-object-storage" }
minco-plugin-events = { version = "1.6.0", path = "plugins/minco-plugin-events" }
minco-plugin-notifications = { version = "1.6.0", path = "plugins/minco-plugin-notifications" }
minco-plugin-audit = { version = "1.6.0", path = "plugins/minco-plugin-audit" }
minco-plugin-feedback = { version = "1.6.0", path = "plugins/minco-plugin-feedback", default-features = false }
minco-plugin-static-site = { version = "1.6.0", path = "plugins/minco-plugin-static-site" }
minco-plugin-realtime = { version = "1.6.0", path = "plugins/minco-plugin-realtime" }
minco-sqlx-postgres = { version = "1.6.0", path = "extensions/minco-sqlx-postgres" }
minco-sqlx-sqlite = { version = "1.6.0", path = "extensions/minco-sqlx-sqlite" }
minco-aws-adapters = { version = "1.6.0", path = "extensions/minco-aws-adapters" }
minco-aws-dynamodb = { version = "1.6.0", path = "extensions/minco-aws-dynamodb" }
minco-aws-lambda = { version = "1.6.0", path = "extensions/minco-aws-lambda" }
minco-aws-worker = { version = "1.6.0", path = "extensions/minco-aws-worker" }
cargo-minco = { version = "1.6.0", path = "crates/minco-cli" }

# Private reference-application packages. They remain path-only and cannot be
# published accidentally.
orders-domain = { path = "examples/orders/domain" }
orders-application = { path = "examples/orders/application" }
orders-adapters = { path = "examples/orders/adapters" }
orders-api = { path = "examples/orders/api" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
option_if_let_else = "allow"
future_not_send = "allow"
too_many_lines = "allow"

[workspace.metadata.minco.release]
# Initial crates.io publication order. Dependencies must be visible in the
# registry before dependent crates are uploaded.
package_tests = [
  "minco-config",
  "minco-contract",
  "minco-db",
  "minco-deploy-aws",
  "minco-dev",
  "minco-plugin-realtime",
  "minco-project-view",
  "minco-mcp",
  "minco-workbench",
  "minco-aws-dynamodb",
  "minco-plugin-payments-waffo",
]
publish = [
  "minco-core",
  "minco-config",
  "minco-db",
  "minco-dev",
  "minco-contract",
  "minco-http",
  "minco-release",
  "minco-plugin-static-site",
  "minco-deploy-aws",
  "minco-test",
  "minco-plan",
  "minco-project-view",
  "minco-mcp",
  "minco-workbench",
  "minco-plugin-health",
  "minco-plugin-observability",
  "minco-plugin-idempotency",
  "minco-plugin-sessions",
  "minco-plugin-identity",
  "minco-plugin-object-storage",
  "minco-plugin-events",
  "minco-plugin-notifications",
  "minco-plugin-audit",
  "minco-sqlx-postgres",
  "minco-sqlx-sqlite",
  "minco-plugin-feedback",
  "minco-plugin-realtime",
  "minco-plugin-payments-waffo",
  "minco-aws-adapters",
  "minco-aws-dynamodb",
  "minco-aws-lambda",
  "minco-aws-worker",
  "minco",
  "cargo-minco",
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
